function showLookup(raw){const e=lookupEntry(raw);document.querySelector('.lookup-mask')?.remove();document.body.insertAdjacentHTML('beforeend',`<div class="lookup-mask" id="lookupMask"><div class="lookup-card"><div class="date">点击的单词</div><div class="lookup-word">${escapeHtml(e.word)}</div>${e.base!==e.word?`<div class="date">原形：${escapeHtml(e.base)}</div>`:''}<div class="ipa">${escapeHtml(e.ipa||'点击喇叭听标准读音')}</div><div class="lookup-meaning">${escapeHtml(e.meaning)}</div><div class="lookup-actions"><button class="btn secondary" data-speak="${escapeHtml(e.word)}">🔊 播放读音</button>${e.learnable?`<button class="btn" data-add-word="${escapeHtml(e.word)}">加入今日学习</button>`:'<button class="btn" id="closeLookup">知道了</button>'}</div><button class="mini" id="closeLookup2" style="width:100%;margin-top:10px">关闭</button></div></div>`);document.querySelector('.lookup-mask [data-speak]').onclick=()=>speak(e.word)}
function addLookupWord(raw){const e=lookupEntry(raw),name=e.base,known=wordByName(name);if(!known){state.custom.push({word:name,meaning:e.meaning,ipa:e.ipa,phrase:'来自语法句子'});}if(!state.dailyWords.includes(name))state.dailyWords.push(name);if(!state.dailyPending.includes(name)&&state.vocabPhase!=='complete')state.dailyPending.push(name);state.wrong[name]=(state.wrong[name]||0)+1;save();document.querySelector('.lookup-mask')?.remove();toast(`${name} 已加入今日学习`)}
function wordGuide(w){const g=WORD_GUIDES[w.word]||[`核心意思是“${w.meaning}”，常见搭配：${w.phrase||w.word}。`,w.word.split('').join(' · '),`先用搭配“${w.phrase||w.word}”造一个短句，加深记忆。`];return{explain:w.explain||g[0],memory:w.memory||g[1],example:w.example||g[2]}}
function grammarSupport(q){const parts=q.q.split('___'),keywords=(q.words||[]).map(wordByName).filter(Boolean).map(w=>`${w.word}＝${w.meaning}`).join('；');return{cn:GRAMMAR_CN[q.gid]||'先结合今日关键词理解整句，再判断空格需要什么。',keywords:keywords||'本题考查刚学过的句型',before:parts[0]?.trim()||'句首',after:parts[1]?.trim()||'句尾'}}
function dailyGrammarTopics(){const names=dailyWordList().map(w=>w.word);return GRAMMAR_TOPICS.map(t=>({...t,questions:t.questions.filter(q=>q.words.some(w=>names.includes(w)))})).filter(t=>t.questions.length)}
function dailyGrammarQuestions(){const names=dailyWordList().map(w=>w.word),built=dailyGrammarTopics().flatMap(t=>t.questions);const online=(state.lessonGrammar||[]).filter(g=>names.some(w=>(`${g.q} ${g.note||''}`).toLowerCase().includes(w.toLowerCase()))).map((g,i)=>({...g,gid:`online-${i}-${g.q}`,words:names.filter(w=>(`${g.q} ${g.note||''}`).toLowerCase().includes(w.toLowerCase()))}));return[...built,...online].filter((g,i,a)=>a.findIndex(x=>x.q===g.q)===i)}

function learn(){ensureFlow();const names=currentStudyList();if(!names.length){if(state.vocabPhase==='quiz'){state.tab='quiz';setTimeout(render,0);return `<div class="shell">${head('准备闯关','正在进入今日刷题…')}</div>`}if(state.vocabPhase==='complete')return `<div class="shell">${head('今日词汇已通关','所有单词均已做对')}<div class="panel"><div class="empty">🎉 今天的词汇学习完成<br><br>可以进入“刷题 → 语法”继续学习。</div></div></div>`}const isWarm=state.warmupPending.length>0,w=wordByName(names[0]),guide=wordGuide(w),done=(isWarm?state.warmupWords.length-state.warmupPending.length:dailyWordList().length-state.dailyPending.length),total=isWarm?state.warmupWords.length:dailyWordList().length;return `<div class="shell">${head(isWarm?'课前温故':state.vocabPhase==='relearn'?'错词回炉':'今日背词',`${done}/${total} 已通过 · 记住后不再重复`)}<div class="tabs"><button class="tab active">${isWarm?'旧词抽查':'老师讲解'}</button><button class="tab" id="slowBtn">🐢 慢速朗读</button></div><section class="study-card"><span class="tag">${isWarm?'课前复习':w.tag}</span><div class="word">${escapeHtml(w.word)}</div><div class="ipa">音标：${escapeHtml(w.ipa||'暂未收录')}</div><button class="speak" data-speak="${escapeHtml(w.word)}">🔊</button><div id="answer" class="${revealed?'':'hidden'}"><div class="meaning">${w.meaning}</div><div class="phrase">${w.phrase}</div><div class="teacher-note"><b>👩‍🏫 老师讲解</b><div>${escapeHtml(guide.explain)}</div><div><strong>拼写记忆：</strong>${escapeHtml(guide.memory)}</div><div><strong>例句：</strong>${escapeHtml(guide.example)}</div></div></div></section>${revealed?`<div class="study-actions"><button class="btn wrong" data-rate="0">还没记住</button><button class="btn right" data-rate="1">记住了</button></div>`:`<button class="btn" id="reveal" style="width:100%;margin-top:15px">显示答案和讲解</button>`}</div>`}

function fullPlanPanel(){const plans=fullPlanCourses(),done=state.completedFullDays||[];if(!plans.length)return `<section class="panel" style="padding:18px;margin-bottom:14px"><b>完整四级词库正在载入</b><p class="date">将载入2600+核心词，按每天35词自动分课。</p><button class="btn" id="loadFullWords" style="width:100%">重新加载完整词库</button></section>`;const weeks=[];for(let i=0;i<plans.length;i+=7)weeks.push(plans.slice(i,i+7));return `<div class="section-title"><h2>完整词汇计划</h2><span>${done.length}/${plans.length}天</span></div><section class="panel" style="padding:16px;margin-bottom:14px"><b>${state.fullCETWords.length}个四级核心词 · 每天${FULL_WORDS_PER_DAY}词</b><p class="date">共${plans.length}天新词，剩余考前时间用于总复习、错词和模拟。</p>${weeks.map((week,i)=>`<details ${week.some(x=>x.day===state.fullPlanDay)?'open':''} class="setting"><summary>第${i+1}周 · Day ${week[0].day}—${week[week.length-1].day}</summary><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px">${week.map(p=>`<button class="mini" data-full-day="${p.day}" style="padding:10px 5px">${done.includes(p.day)?'✓ ':''}Day ${p.day} · ${p.words.length}词</button>`).join('')}</div></details>`).join('')}<div class="date" style="margin-top:12px">词库来源：Qwerty Learner CET-4（GPL-3.0）；已在本机缓存，首次载入后可继续使用。</div></section>`}
function courses(){const current=Number(state.selectedCourse),doneSkills=state.completedSkillCourses||[],groups=['语法','听力','阅读','写作','翻译','应试'];return `<div class="shell">${head('完整四级课程',`共 ${COURSE_CATALOG.length+SKILL_COURSES.length} 课 · 全部解锁`)}<div class="section-title"><h2>第一阶段 · 词汇基础</h2><span>${COURSE_CATALOG.length}课</span></div>${COURSE_CATALOG.map(c=>{const active=c.id===current,done=(state.completedCourses||[]).includes(c.id);return `<section class="panel" style="padding:16px;margin-bottom:10px"><div style="display:flex;align-items:center;gap:10px"><i class="check ${done?'done':''}">${done?'✓':c.id}</i><div style="flex:1"><b>${escapeHtml(c.title)}</b><div class="date">${c.words.length}词 · ${escapeHtml(COURSE_TOPICS[c.id])}</div></div><button class="mini" data-course="${c.id}">${done?'复习':active?'继续':'开始'}</button></div><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px">${c.words.map(w=>`<span class="tag" style="margin:0">${escapeHtml(w)}</span>`).join('')}</div></section>`}).join('')}${groups.map(stage=>{const list=SKILL_COURSES.filter(c=>c.stage===stage);return `<div class="section-title"><h2>${escapeHtml(stage)}专项</h2><span>${list.length}课</span></div><div class="panel" style="padding:8px 16px;margin-bottom:14px">${list.map(c=>{const done=doneSkills.includes(c.id);return `<div class="task"><i class="check ${done?'done':''}">${done?'✓':COURSE_CATALOG.length+SKILL_COURSES.findIndex(x=>x.id===c.id)+1}</i><div style="flex:1"><b>${escapeHtml(c.title)}</b><span>${escapeHtml(c.goal)} · ${c.minutes}分钟</span></div><button class="mini" data-skill="${c.id}">${done?'复习':'学习'}</button></div>`}).join('')}</div>`}).join('')}<p class="date" style="line-height:1.7;margin:14px 4px">课程全部提前解锁。词汇课使用记忆循环和闯关；专项课包含讲解、例句、跟读及课后练习。刘晓艳视频里的新词仍可加入当天学习。</p></div>`}
function fullCourses(){const total=fullPlanCourses().length+COURSE_CATALOG.length+SKILL_COURSES.length;return courses().replace(`共 ${COURSE_CATALOG.length+SKILL_COURSES.length} 课 · 全部解锁`,`共 ${total} 个每日/专项课程 · 全部解锁`).replace('<div class="section-title"><h2>第一阶段 · 词汇基础</h2>',fullPlanPanel()+'<div class="section-title"><h2>原有基础词汇课</h2>')}

function me(){return `<div class="shell">${head('我的学习','进度保存在这台手机 · '+APP_VERSION)}<div class="panel"><div class="setting"><b>📚 已掌握 ${state.learned.length} / ${allWords().length} 词</b><div class="date">今天完成 ${state.todayCount} 次单词练习、${state.quizCount} 道题</div></div><div class="setting"><b>添加今天从视频里学到的词</b><div class="date">提交后自动进入今日背词和闯关，原课程不变</div><form class="form" id="addForm" style="margin-top:12px"><input class="field" name="word" placeholder="英文，如 liberty" required autocapitalize="none"><input class="field" name="meaning" placeholder="中文意思" required><button class="btn">加入题库</button></form></div><div class="setting"><b>换手机备份</b><div class="date">仅换手机时使用；“下载备份”会保存 JSON 文件</div><div class="study-actions"><button class="btn secondary" id="export">下载备份</button><label class="btn secondary" style="text-align:center">恢复备份<input id="import" type="file" accept="application/json" hidden></label></div></div><div class="setting"><button class="btn wrong" id="reset" style="width:100%">清空本机进度</button></div></div><div class="panel" style="margin-top:14px"><b>安装到 iPhone 主屏幕</b><p class="date" style="line-height:1.7">用 Safari 打开本页 → 点“分享” → “添加到主屏幕” → 打开“作为网页 App”。之后像普通 App 一样使用。</p></div></div>`}
function render(){const views={home,learn,quiz,wrong,me,courses:fullCourses,bedtime,skill:skillLesson};$('#app').innerHTML=(views[state.tab]||home)();if(state.tab==='home'){const grid=$('.grid');if(grid)grid.insertAdjacentHTML('afterend',`<div class="grid" style="margin-top:12px"><button class="action" data-go="courses"><span class="icon">📚</span><b>课程中心</b><small>${escapeHtml(state.courseTitle||'选择课程')} · 完整课程 ${fullPlanCourses().length+COURSE_CATALOG.length+SKILL_COURSES.length} 课</small></button><button class="action" data-go="bedtime"><span class="icon">🌙</span><b>睡前10分钟</b><small>${state.bedtimeDoneDate===today()?'今日已完成':'当天词＋易错词快速复习'}</small></button></div>`)}if(state.tab==='me'){const first=$('.panel .setting');if(first)first.insertAdjacentHTML('afterend','<div class="setting"><b>发送学习进度给英语老师</b><div class="date">生成今日学习记录并发送到 ChatGPT；不会下载文件</div><button class="btn" id="syncTeacher" style="width:100%;margin-top:12px">发送到 ChatGPT</button></div><div class="setting"><b>联网更新课程</b><div class="date">当前：'+escapeHtml(state.courseTitle||'基础课程')+' · 已同步至第 '+(state.onlineLesson||0)+' 课</div><button class="btn" id="onlineUpdate" style="width:100%;margin-top:12px">检查并更新</button><label class="btn secondary" style="display:block;text-align:center;margin-top:10px">手动导入课程包<input id="courseImport" type="file" accept="application/json,.json" hidden></label></div>')}renderNav();bind();bindCourseImport()}
function syncReport(){const stats=state.todayWordStats||{},practiced=Object.keys(stats),sum=k=>practiced.reduce((n,w)=>n+(stats[w][k]||0),0),learnOk=sum('learnOk')+sum('warmupOk'),learnForget=sum('learnForget')+sum('warmupForget'),quizOk=sum('quizOk'),quizWrong=sum('quizWrong'),bedtimeOk=sum('bedtimeOk'),bedtimeForget=sum('bedtimeForget');const weak=[...new Set([...practiced.filter(w=>(stats[w].learnForget||0)+(stats[w].quizWrong||0)+(stats[w].warmupForget||0)+(stats[w].bedtimeForget||0)>0),...allWords().filter(w=>(state.wrong[w.word]||0)>0).sort((a,b)=>state.wrong[b.word]-state.wrong[a.word]).slice(0,8).map(w=>w.word)])].join('、')||'暂无';const legacy=!practiced.length&&state.todayCount?`\n升级前旧版操作：${state.todayCount} 次（旧版没有逐词明细，无法准确还原）`:'';return `【承希英语学习记录｜${APP_VERSION}】\n日期：${today()}\n当前课程：${state.courseTitle||'未选择'}\n今日课程词：${(state.dailyWords||[]).join('、')||'暂无'}\n今日实际练过：${practiced.join('、')||'暂无'}\n单词学习：记住 ${learnOk} 次，没记住 ${learnForget} 次\n词义刷题：答对 ${quizOk} 道，答错 ${quizWrong} 道\n语法训练：答对 ${state.grammarCorrect||0} 道，答错 ${state.grammarWrong||0} 道\n睡前复习：${state.bedtimeDoneDate===today()?'已完成':'未完成'}（记住 ${bedtimeOk} 次，没记住 ${bedtimeForget} 次）${legacy}\n累计掌握：${state.learned.length}/${allWords().length} 词\n已完成课程：${(state.completedFullDays||[]).length+(state.completedCourses||[]).length+(state.completedSkillCourses||[]).length}/${fullPlanCourses().length+COURSE_CATALOG.length+SKILL_COURSES.length}\n今日仍需巩固：${weak}\n数据说明：仅统计本机今天实际点击和作答。\n请根据这份记录更新我的学习档案，并安排下一次英语学习。`}
function validateCoursePack(pack){if(!pack||!Array.isArray(pack.words)||!Array.isArray(pack.grammar))throw new Error('invalid');for(const w of pack.words){if(!w.word||!w.meaning)throw new Error('invalid word')}for(const g of pack.grammar){if(!g.q||!g.answer||!Array.isArray(g.options))throw new Error('invalid grammar')}return pack}
function applyCoursePack(pack){validateCoursePack(pack);const lesson=Number(pack.lesson)||0,isNew=lesson>(state.onlineLesson||0);const words=[...(state.lessonWords||[]),...pack.words];const grammar=[...(state.lessonGrammar||[]),...pack.grammar];state.lessonWords=words.filter((w,i,a)=>a.findIndex(x=>x.word===w.word)===i);state.lessonGrammar=grammar.filter((g,i,a)=>a.findIndex(x=>x.q===g.q)===i);state.courseTitle=pack.title||'新课程';state.onlineLesson=Math.max(state.onlineLesson||0,lesson);state.lastOnlineCheck=today();if(isNew){if(state.dailyWords.length){state.previousLessonWords=[...state.dailyWords];state.lessonArchive=[...new Set([...(state.lessonArchive||[]),...state.dailyWords])]}state.dailyWordDate='';state.dailyWords=[];state.dailyPending=[];state.dailyRemembered=[];state.warmupWords=[];state.warmupPending=[];state.vocabPhase='learn';state.quizPending=[];state.quizMistakes=[];state.quizRound=1;state.grammarStudyDate='';state.grammarReady=false;state.grammarPending=[];state.grammarMistakes=[];state.grammarCompletedDate=''}save()}
async function checkOnlineCourse(manual=true){const btn=$('#onlineUpdate');if(btn){btn.disabled=true;btn.textContent='正在检查…'}try{const res=await fetch(REMOTE_COURSE_URL+'?t='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('network');const pack=validateCoursePack(await res.json());const lesson=Number(pack.lesson)||0;if(lesson<=(state.onlineLesson||0)){state.lastOnlineCheck=today();save();if(manual)toast('已经是最新课程');if(btn){btn.disabled=false;btn.textContent='检查并更新'}return}applyCoursePack(pack);render();toast(`联网更新成功：${pack.words.length} 个词，${pack.grammar.length} 道语法题`)}catch(e){if(manual)toast('暂时无法联网，请稍后再试');if(btn){btn.disabled=false;btn.textContent='检查并更新'}}}
function bindCourseImport(){const input=$('#courseImport');if(!input)return;input.onchange=async()=>{try{const pack=JSON.parse(await input.files[0].text());applyCoursePack(pack);render();toast(`已更新：${pack.words.length} 个词，${pack.grammar.length} 道语法题`)}catch(e){toast('课程包格式不正确，请重新下载')}}}
function nextStudy(ok){const names=currentStudyList(),name=names[0];if(!name)return;if(state.warmupPending.length){state.warmupPending.shift();state.todayCount++;logWord(name,'warmup',ok);if(!ok){state.warmupForgotten=[...new Set([...state.warmupForgotten,name])];state.wrong[name]=(state.wrong[name]||0)+2;if(!state.dailyWords.includes(name))state.dailyWords.push(name);if(!state.dailyPending.includes(name))state.dailyPending.push(name)}else state.wrong[name]=Math.max(0,(state.wrong[name]||0)-1)}else{record(name,ok,'learn');if(ok){state.dailyPending.shift();state.dailyRemembered=[...new Set([...state.dailyRemembered,name])]}else{state.dailyPending.shift();state.dailyPending.push(name)}if(!state.dailyPending.length){const roundWords=[...state.dailyRemembered];state.dailyRemembered=[];startQuizRound(roundWords)}}revealed=false;save();render()}
function answerQuiz(ans,button){
 if(answered)return;
 answered=true;
 const q=currentQuiz,ok=ans.trim().toLowerCase()===q.answer.toLowerCase();
 state.quizCount++;
 if(q.word){record(q.word.word,ok,'quiz');state.quizPending=state.quizPending.filter(w=>w!==q.word.word);if(!ok)state.quizMistakes=[...new Set([...state.quizMistakes,q.word.word])]}
 else if(q.type==='grammar'){if(ok)state.grammarCorrect=(state.grammarCorrect||0)+1;else state.grammarWrong=(state.grammarWrong||0)+1;state.grammarPending=state.grammarPending.filter(id=>id!==q.gid);if(!ok)state.grammarMistakes=[...new Set([...state.grammarMistakes,q.gid])];save()}
 else save();
 if(button){document.querySelectorAll('.option').forEach(b=>{if(b.dataset.opt===q.answer)b.classList.add('correct')});if(!ok)button.classList.add('wrong')}
 const f=$('#feedback'),lesson=q.note?`<br><strong>👩‍🏫 老师讲解：</strong>${escapeHtml(q.note)}`:'';
 const full=q.type==='grammar'?q.q.replace('___',q.answer):'';
 const sentenceReview=full?`<div class="teacher-note"><b>正确句子 · 点单词可继续学习</b><div class="sentence-tools"><button class="mini" data-speak="${escapeHtml(full)}">🔊 整句</button><div class="sentence-line">${interactiveSentence(full)}</div></div><div class="date">${escapeHtml(grammarSupport(q).cn)}</div></div>`:'';
 const roundEnd=q.word&&!state.quizPending.length||q.type==='grammar'&&!state.grammarPending.length;
 f.innerHTML=`<div class="feedback ${ok?'good':'bad'}">${ok?'✅ 正确':'❌ 正确答案：'+escapeHtml(q.answer)}${lesson}</div>${sentenceReview}<button class="btn" id="nextQ" style="width:100%;margin-top:10px">${roundEnd?'查看本轮结果':'下一题'}</button>`;
 document.querySelector('#feedback [data-speak]')?.addEventListener('click',e=>speak(e.currentTarget.dataset.speak));
 $('#nextQ').onclick=()=>{if(q.word&&!state.quizPending.length)finishQuizRound();if(q.type==='grammar'&&!state.grammarPending.length)finishGrammarRound();currentQuiz=null;answered=false;render()}
}
function addManualWord(form){const fd=new FormData(form),word=fd.get('word').trim().toLowerCase(),meaning=fd.get('meaning').trim();if(!word||!meaning)return;dailyWordList();let known=wordByName(word);if(!known){state.custom.push({word,meaning,ipa:'',phrase:'你今天添加的单词',tag:'今日自加'});known=wordByName(word)}if(state.dailyWords.includes(word)){form.reset();toast('这个词已经在今日课程里了');return}state.dailyWords.push(word);state.dailyPending=[...new Set([...(state.dailyPending||[]),word])];state.dailyRemembered=(state.dailyRemembered||[]).filter(w=>w!==word);if(state.vocabPhase==='quiz'||state.vocabPhase==='complete'){state.vocabPhase='learn';state.quizPending=[];state.quizMistakes=[];state.quizRound=1}state.wrong[word]=Math.max(1,state.wrong[word]||0);save();form.reset();toast(`${word} 已加入今日课程`)}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.go;if(state.tab==='quiz')state.mode='challenge';save();render()});document.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>speak(b.dataset.speak));const slow=$('#slowBtn');if(slow)slow.onclick=()=>{const w=wordByName(currentStudyList()[0]);if(w)speak(w.word,true)};const rev=$('#reveal');if(rev)rev.onclick=()=>{revealed=true;render()};document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>nextStudy(b.dataset.rate==='1'));document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;currentQuiz=null;answered=false;save();render()});document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>answerQuiz(b.dataset.opt,b));const ss=$('#submitSpell');if(ss)ss.onclick=()=>answerQuiz($('#spell').value);const sp=$('#spell');if(sp)sp.onkeydown=e=>{if(e.key==='Enter')answerQuiz(sp.value)};const rw=$('#reviewWrong');if(rw)rw.onclick=()=>{const words=allWords().filter(w=>(state.wrong[w.word]||0)>0).map(w=>w.word);state.dailyWords=[...new Set([...state.dailyWords,...words])];state.dailyPending=[...words];state.dailyRemembered=[];state.vocabPhase='relearn';state.tab='learn';save();render()};const sync=$('#syncTeacher');if(sync)sync.onclick=async()=>{const report=syncReport();try{if(navigator.share)await navigator.share({title:'承希英语学习记录',text:report});else throw new Error('share unavailable')}catch(e){if(e.name!=='AbortError'){const ta=document.createElement('textarea');ta.value=report;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('记录已复制，请粘贴到 ChatGPT')}}};const online=$('#onlineUpdate');if(online)online.onclick=()=>checkOnlineCourse(true);const form=$('#addForm');if(form)form.onsubmit=e=>{e.preventDefault();const fd=new FormData(form);const word=fd.get('word').trim().toLowerCase(),meaning=fd.get('meaning').trim();if(allWords().some(x=>x.word===word))return toast('这个词已经在题库里了');state.custom.push({word,meaning,ipa:'',phrase:'你自己添加的单词'});save();form.reset();toast('已加入题库')};const ex=$('#export');if(ex)ex.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'}));a.download='承希英语学习记录.json';a.click();URL.revokeObjectURL(a.href)};const im=$('#import');if(im)im.onchange=async()=>{try{state={...defaultState,...JSON.parse(await im.files[0].text())};save();render();toast('学习记录已恢复')}catch{toast('文件格式不正确')}};const reset=$('#reset');if(reset)reset.onclick=()=>{if(confirm('确定清空全部学习进度吗？')){state={...defaultState};save();render()}}}

document.addEventListener('click',e=>{const lookup=e.target.closest?.('[data-lookup]');if(lookup)showLookup(lookup.dataset.lookup);const add=e.target.closest?.('[data-add-word]');if(add)addLookupWord(add.dataset.addWord);if(e.target.id==='closeLookup'||e.target.id==='closeLookup2'||e.target.id==='lookupMask')document.querySelector('.lookup-mask')?.remove();const course=e.target.closest?.('[data-course]');if(course)selectCourse(course.dataset.course);if(e.target.id==='startGrammar')startGrammarPractice();if(e.target.id==='restartGrammar'){state.grammarReady=false;state.grammarPending=[];state.grammarMistakes=[];state.grammarCompletedDate='';currentQuiz=null;answered=false;save();render()}if(e.target.id==='revealBedtime'){bedtimeRevealed=true;render()}const bedtimeBtn=e.target.closest?.('[data-bedtime]');if(bedtimeBtn)nextBedtime(bedtimeBtn.dataset.bedtime==='1')});
document.addEventListener('click',e=>{const full=e.target.closest?.('[data-full-day]');if(full)selectFullCourse(full.dataset.fullDay);if(e.target.id==='loadFullWords')loadFullCETWords(true);const skill=e.target.closest?.('[data-skill]');if(skill){state.activeSkillCourse=skill.dataset.skill;state.tab='skill';save();render()}if(e.target.id==='finishSkill'){const id=state.activeSkillCourse;state.completedSkillCourses=[...new Set([...(state.completedSkillCourses||[]),id])];state.tab='courses';save();render();toast('本课已完成')}});
document.addEventListener('submit',e=>{if(e.target.id==='addForm'){e.preventDefault();e.stopImmediatePropagation();addManualWord(e.target)}},true);

render();
loadFullCETWords(false);
if(state.lastOnlineCheck!==today())setTimeout(()=>checkOnlineCourse(false),700);
</script>
