  <script>const KEY='chengxiEnglishV1';
const REMOTE_COURSE_URL='https://raw.githubusercontent.com/jiangchengxi48-art/chengxi-english-updates/main/course-latest.json';
const today=()=>new Date().toISOString().slice(0,10);
const defaultState={tab:'home',learned:[],wrong:{annual:2,satisfy:1,dissatisfaction:1,sophisticated:1,dependent:1,independent:1,adequate:1},custom:[],lessonWords:[],lessonGrammar:[],courseTitle:'基础课程',onlineLesson:0,lastOnlineCheck:'',dailyWordDate:'',dailyWords:[],previousLessonWords:[],lessonArchive:[],warmupWords:[],warmupPending:[],warmupForgotten:[],dailyPending:[],dailyRemembered:[],vocabPhase:'learn',quizPending:[],quizMistakes:[],quizRound:1,streak:1,lastDay:today(),todayCount:0,quizCount:0,studyIndex:0,mode:'challenge'};
let state={...defaultState,...JSON.parse(localStorage.getItem(KEY)||'{}')};
if(state.lastDay!==today()){
  const yesterday=new Date(Date.now()-86400000).toISOString().slice(0,10);
  if(Array.isArray(state.dailyWords)&&state.dailyWords.length){state.previousLessonWords=[...state.dailyWords];state.lessonArchive=[...new Set([...(state.lessonArchive||[]),...state.dailyWords])]}
  state.streak=state.lastDay===yesterday?(state.streak||0)+1:1;
  state.lastDay=today();state.todayCount=0;state.quizCount=0;state.dailyWordDate='';state.dailyWords=[];state.warmupWords=[];state.warmupPending=[];state.warmupForgotten=[];state.dailyPending=[];state.dailyRemembered=[];state.vocabPhase='learn';state.quizPending=[];state.quizMistakes=[];state.quizRound=1;state.mode='challenge';
}
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
const allWords=()=>[...WORDS,...(state.lessonWords||[]).map((x,i)=>({...x,id:500+i,tag:x.tag||'课程'})),...state.custom.map((x,i)=>({...x,id:1000+i,tag:'自加'}))].filter((w,i,a)=>a.findIndex(x=>x.word===w.word)===i);
const allGrammar=()=>[...GRAMMAR,...(state.lessonGrammar||[])].filter((g,i,a)=>a.findIndex(x=>x.q===g.q)===i);
function dailyWordList(){const pool=allWords();const lookup=new Map(pool.map(w=>[w.word,w]));if(state.dailyWordDate===today()&&Array.isArray(state.dailyWords)&&state.dailyWords.length){const kept=state.dailyWords.map(w=>lookup.get(w)).filter(Boolean);if(kept.length)return kept}const picked=[];const add=w=>{if(w&&!picked.some(x=>x.word===w.word)&&picked.length<10)picked.push(w)};pool.filter(w=>(state.wrong[w.word]||0)>0).sort((a,b)=>(state.wrong[b.word]||0)-(state.wrong[a.word]||0)).slice(0,4).forEach(add);(state.lessonWords||[]).map(w=>lookup.get(w.word)).filter(w=>w&&!state.learned.includes(w.word)).forEach(add);pool.filter(w=>!state.learned.includes(w.word)).forEach(add);pool.forEach(add);state.dailyWordDate=today();state.dailyWords=picked.map(w=>w.word);state.dailyPending=[...state.dailyWords];state.dailyRemembered=[];state.vocabPhase='learn';state.quizPending=[];state.quizMistakes=[];state.quizRound=1;state.studyIndex=0;save();return picked}
function wordByName(name){return allWords().find(w=>w.word===name)}
function prepareWarmup(){if(state.warmupWords.length)return;const previous=(state.previousLessonWords||[]).filter(wordByName);const older=shuffle((state.lessonArchive||[]).filter(w=>wordByName(w)&&!previous.includes(w))).slice(0,3);state.warmupWords=[...new Set([...previous,...older])];state.warmupPending=[...state.warmupWords];save()}
function ensureFlow(){dailyWordList();prepareWarmup();state.dailyPending=(state.dailyPending||[]).filter(wordByName);state.dailyRemembered=state.dailyRemembered||[];state.quizPending=(state.quizPending||[]).filter(wordByName);state.quizMistakes=state.quizMistakes||[];if(!state.dailyPending.length&&state.vocabPhase==='learn'&&!state.dailyRemembered.length)state.dailyPending=[...state.dailyWords];save()}
const $=s=>document.querySelector(s);
const escapeHtml=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)};
function speak(text,slow=false){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=slow?.62:.86;speechSynthesis.speak(u)}
function record(word,ok){state.todayCount++;if(ok){state.wrong[word]=Math.max(0,(state.wrong[word]||0)-1)}else{state.wrong[word]=(state.wrong[word]||0)+2}save()}
const WORD_GUIDES={
anniversary:['anniversary 可指结婚、成立等“周年纪念日”，是可数名词。','anni + vers + ary；注意开头双写 n。','Today is our wedding anniversary. 今天是我们的结婚纪念日。'],
annual:['annual 是形容词，表示“一年一次的、每年的”。','ann + ual；开头 a，中间双写 n，结尾 ual。','The school holds an annual meeting. 学校每年举行一次会议。'],
dissatisfaction:['名词，表示“不满”；常与 with 搭配。','dis + satis + fac + tion；中间一定有 fac。','She expressed dissatisfaction with the result. 她对结果表示不满。'],
satisfy:['动词，表示“使满意、满足需求”。','satis + fy；不要漏掉第二个 s。','The result did not satisfy me. 这个结果没有让我满意。'],
sophisticated:['形容词，可表示“复杂精密的”或“老练的”。','soph + istic + ated；结尾是 -ated。','This is a sophisticated machine. 这是一台精密的机器。'],
isolated:['形容词，表示“孤立的、偏远的”；由 isolate 加 d 构成。','i + so + late + d；不要写成 isloated。','They live in an isolated village. 他们住在一个偏远村庄。'],
isolate:['动词，表示“使隔离、使孤立”。','i + so + late；开头 i 不能漏。','Doctors isolated the patient. 医生隔离了这名病人。'],
tuition:['名词，常指学费；tuition fees 是常见搭配。','tu + i + tion；注意中间有 i。','Her parents paid the tuition fees. 她父母支付了学费。'],
royal:['形容词，表示“王室的、皇家的”。','roy + al；读音像 ROY-uhl，但结尾写 al。','The royal family visited the city. 王室成员访问了这座城市。'],
thorough:['形容词，表示“彻底的、详尽的”。','thor + ough；不要和 through 混淆。','We need a thorough review. 我们需要一次彻底的检查。'],
dependent:['形容词，常用 be dependent on 表示“依赖于”。','depend + ent；句中通常要有 be 动词。','He is dependent on his parents. 他依赖父母。'],
independent:['形容词，常用 be independent of 表示“独立于”。','in + depend + ent；不是 indenpendent。','She is independent of her parents. 她不依赖父母。'],
adequate:['形容词，表示“足够的、合格的”。','ad + e + quate；开头是元音音素，单数名词前用 an。','We have adequate time. 我们有足够的时间。'],
candidate:['可数名词，表示“候选人、应试者”；单数前通常需要 a。','can + di + date；这里 date 轻读。','He is a strong candidate. 他是一位有力候选人。'],
endure:['动词，表示“忍受、经受”。','en + dure；重音在第二部分。','We must endure hardship. 我们必须忍受困难。'],
effort:['名词，make an effort 表示“努力”。','ef + fort；注意双写 f。','I make an effort to learn English. 我努力学习英语。'],
habit:['可数名词，develop a habit 表示“养成习惯”。','ha + bit；两个音节。','Reading is a good habit. 阅读是一个好习惯。'],
focus:['动词或名词；focus on 表示“专注于”。','fo + cus；结尾是 cus。','Please focus on the question. 请专注于问题。'],
remember:['动词；remember to do 表示“记得去做某事”。','re + mem + ber；中间 mem。','Remember to review these words. 记得复习这些单词。'],
review:['动词或名词，表示“复习、回顾”。','re + view；再次看就是复习。','I review vocabulary every night. 我每晚复习词汇。'],
mistake:['可数名词，make a mistake 表示“犯错误”。','mis + take；不是把某事“拿错”了。','Do not be afraid to make mistakes. 不要害怕犯错。']};
function wordGuide(w){const g=WORD_GUIDES[w.word]||[`核心意思是“${w.meaning}”，常见搭配：${w.phrase||w.word}。`,w.word.split('').join(' · '),`先用搭配“${w.phrase||w.word}”造一个短句，加深记忆。`];return{explain:w.explain||g[0],memory:w.memory||g[1],example:w.example||g[2]}}
function head(title,sub=''){return `<div class="topbar"><div><div class="brand">${title}</div>${sub?`<div class="date">${sub}</div>`:''}</div><span class="pill">🔥 ${state.streak} 天</span></div>`}
const navs=[['home','⌂','今日'],['learn','▣','背词'],['quiz','✎','刷题'],['wrong','↻','错题'],['me','●','我的']];
function renderNav(){ $('#nav').innerHTML=navs.map(([id,ic,tx])=>`<button class="navbtn ${state.tab===id?'active':''}" data-nav="${id}"><i>${ic}</i>${tx}</button>`).join('');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.nav;save();render()}) }
function countdown(){const target=new Date('2026-12-11T09:00:00+08:00');return Math.max(0,Math.ceil((target-new Date())/86400000))}
function home(){ensureFlow();const daily=dailyWordList(),left=state.dailyPending.length,warm=state.warmupPending.length,pct=Math.min(100,Math.round(state.learned.length/allWords().length*100));const phase=warm?'先完成课前复习':state.vocabPhase==='complete'?'今日词汇已通关':state.vocabPhase==='quiz'?`正在第 ${state.quizRound} 轮闯关`:state.vocabPhase==='relearn'?'错词正在回炉':`还剩 ${left} 个词未记住`;return `<div class="shell">${head('早上好，承希','按记忆结果自动安排，不做无效重复')}<section class="hero"><div class="eyebrow">CET-4 倒计时</div><h1>${countdown()} 天</h1><p>${phase}</p><div class="progress"><i style="width:${pct}%"></i></div><div class="progress-row"><span>已掌握 ${state.learned.length} 词</span><span>题库 ${allWords().length} 词</span></div></section><div class="section-title"><h2>现在开始</h2><span>今日已练 ${state.todayCount} 次</span></div><div class="grid"><button class="action" data-go="learn"><span class="icon">🧠</span><b>${warm?'课前温故':state.vocabPhase==='relearn'?'错词回炉':'今日背词'}</b><small>${warm?`剩 ${warm} 个旧词待检查`:left?`剩 ${left} 个，记住即移出`:'今日词已全部记住'}</small></button><button class="action" data-go="quiz"><span class="icon">✍️</span><b>今日闯关</b><small>${state.vocabPhase==='quiz'?`第 ${state.quizRound} 轮剩 ${state.quizPending.length} 题`:state.vocabPhase==='complete'?'已全部做对':'背完今日词后解锁'}</small></button></div><div class="section-title"><h2>今日流程</h2><span>完成一关再进下一关</span></div><div class="today-list"><div class="task"><i class="check ${!warm?'done':''}">${!warm?'✓':''}</i><div><b>1. 课前温故</b><span>上节课全部＋更早课程随机抽查</span></div></div><div class="task"><i class="check ${!left&&state.vocabPhase!=='relearn'?'done':''}">${!left&&state.vocabPhase!=='relearn'?'✓':''}</i><div><b>2. 今日背词 ${daily.length} 个</b><span>记住移出；忘记继续循环并查看老师讲解</span></div></div><div class="task"><i class="check ${state.vocabPhase==='complete'?'done':''}">${state.vocabPhase==='complete'?'✓':''}</i><div><b>3. 闯关直到全对</b><span>错词回炉后，只重测错词</span></div></div><div class="task"><i class="check"></i><div><b>4. 基础语法</b><span>做完每题查看规则与原因</span></div></div></div></div>`}
function currentStudyList(){ensureFlow();if(state.warmupPending.length)return state.warmupPending;if(state.vocabPhase==='relearn'||state.vocabPhase==='learn')return state.dailyPending;return[]}
let revealed=false;
function learn(){ensureFlow();const names=currentStudyList();if(!names.length){if(state.vocabPhase==='quiz'){state.tab='quiz';setTimeout(render,0);return `<div class="shell">${head('准备闯关','正在进入今日刷题…')}</div>`}if(state.vocabPhase==='complete')return `<div class="shell">${head('今日词汇已通关','所有单词均已做对')}<div class="panel"><div class="empty">🎉 今天的词汇学习完成<br><br>可以进入“刷题 → 语法”继续学习。</div></div></div>`}const isWarm=state.warmupPending.length>0,w=wordByName(names[0]),guide=wordGuide(w),done=(isWarm?state.warmupWords.length-state.warmupPending.length:dailyWordList().length-state.dailyPending.length),total=isWarm?state.warmupWords.length:dailyWordList().length;return `<div class="shell">${head(isWarm?'课前温故':state.vocabPhase==='relearn'?'错词回炉':'今日背词',`${done}/${total} 已通过 · 记住后不再重复`)}<div class="tabs"><button class="tab active">${isWarm?'旧词抽查':'老师讲解'}</button><button class="tab" id="slowBtn">🐢 慢速朗读</button></div><section class="study-card"><span class="tag">${isWarm?'课前复习':w.tag}</span><div class="word">${escapeHtml(w.word)}</div><div class="ipa">${w.ipa}</div><button class="speak" data-speak="${escapeHtml(w.word)}">🔊</button><div id="answer" class="${revealed?'':'hidden'}"><div class="meaning">${w.meaning}</div><div class="phrase">${w.phrase}</div><div class="teacher-note"><b>👩‍🏫 老师讲解</b><div>${escapeHtml(guide.explain)}</div><div><strong>拼写记忆：</strong>${escapeHtml(guide.memory)}</div><div><strong>例句：</strong>${escapeHtml(guide.example)}</div></div></div></section>${revealed?`<div class="study-actions"><button class="btn wrong" data-rate="0">还没记住</button><button class="btn right" data-rate="1">记住了</button></div>`:`<button class="btn" id="reveal" style="width:100%;margin-top:15px">显示答案和讲解</button>`}</div>`}
let currentQuiz=null,answered=false;
function startQuizRound(words){state.vocabPhase='quiz';state.quizPending=shuffle([...new Set(words)]);state.quizMistakes=[];state.mode='challenge';currentQuiz=null;answered=false;save()}
function makeQuiz(){if(state.mode==='grammar'){const gs=allGrammar(),g=gs[Math.floor(Math.random()*gs.length)];return{type:'grammar',q:g.q,answer:g.answer,note:g.note,options:shuffle(g.options)}}ensureFlow();if(state.vocabPhase==='quiz'&&!state.quizPending.length)finishQuizRound();const w=wordByName(state.quizPending[0]);if(!w)return null;const type=(state.quizCount+state.quizRound)%2?'spell':'choice';if(type==='spell')return{type:'spell',q:w.meaning,answer:w.word,word:w,note:wordGuide(w).memory};const pool=dailyWordList(),opts=shuffle([w,...shuffle(pool.filter(x=>x.word!==w.word)).slice(0,3)]).map(x=>x.meaning);return{type:'choice',q:w.word,answer:w.meaning,word:w,options:opts,note:wordGuide(w).explain}}
function finishQuizRound(){if(state.quizMistakes.length){state.vocabPhase='relearn';state.dailyPending=[...new Set(state.quizMistakes)];state.dailyRemembered=[];state.quizPending=[];state.quizMistakes=[];state.quizRound++;state.tab='learn';save();return'回炉'}state.vocabPhase='complete';state.learned=[...new Set([...state.learned,...state.dailyWords])];state.dailyWords.forEach(w=>state.wrong[w]=0);state.quizPending=[];save();return'完成'}
function quiz(){ensureFlow();if(state.mode!=='grammar'&&state.vocabPhase!=='quiz'&&state.vocabPhase!=='complete'){const msg=state.warmupPending.length?'先完成课前温故':state.vocabPhase==='relearn'?'先把错词重新背熟':'先把今日单词全部记住';return `<div class="shell">${head('今日闯关','完成背词后才能开始')}<div class="tabs"><button class="tab active" data-mode="challenge">今日闯关</button><button class="tab" data-mode="grammar">语法讲解</button></div><div class="panel"><div class="empty">🔒 ${msg}<br><br><button class="btn" data-go="learn">去背词</button></div></div></div>`}if(state.mode!=='grammar'&&state.vocabPhase==='complete')return `<div class="shell">${head('今日闯关完成','所有词都已做对')}<div class="tabs"><button class="tab active">今日闯关 ✓</button><button class="tab" data-mode="grammar">语法讲解</button></div><div class="panel"><div class="empty">🎉 词汇闯关成功<br><br>今天的错词已经背诵并重新答对。<br><br><button class="btn" data-mode="grammar">继续语法学习</button></div></div></div>`;if(!currentQuiz)currentQuiz=makeQuiz();const q=currentQuiz;if(!q)return `<div class="shell">${head('正在整理本轮结果','请稍候…')}</div>`;let body=q.type==='spell'?`<input id="spell" class="spell-input" placeholder="请输入英文拼写" autocomplete="off" autocapitalize="none"><button class="btn" id="submitSpell" style="width:100%;margin-top:12px">提交答案</button>`:`<div class="options">${q.options.map(o=>`<button class="option" data-opt="${escapeHtml(o)}">${escapeHtml(o)}</button>`).join('')}</div>`;const sub=state.mode==='grammar'?'答题后由老师讲清规则':`第 ${state.quizRound} 轮 · 剩 ${state.quizPending.length} 题`;return `<div class="shell">${head(state.mode==='grammar'?'语法学习':'今日词汇闯关',sub)}<div class="tabs"><button class="tab ${state.mode!=='grammar'?'active':''}" data-mode="challenge">今日闯关</button><button class="tab ${state.mode==='grammar'?'active':''}" data-mode="grammar">语法讲解</button></div><section class="panel" style="padding:22px"><span class="tag">${q.type==='grammar'?'本题考点':q.type==='spell'?'中文写英文':'英文选中文'}</span><div class="quiz-q">${escapeHtml(q.q)}</div>${body}<div id="feedback"></div></section></div>`}
function wrong(){const list=allWords().filter(w=>(state.wrong[w.word]||0)>0).sort((a,b)=>state.wrong[b.word]-state.wrong[a.word]);return `<div class="shell">${head('错题本',`${list.length} 个词需要回炉`)}<div class="panel">${list.length?list.map(w=>`<div class="word-row"><div><b>${escapeHtml(w.word)}</b><span>${w.meaning} · 错误权重 ${state.wrong[w.word]}</span></div><button class="mini" data-speak="${escapeHtml(w.word)}">🔊</button></div>`).join(''):`<div class="empty">暂时没有错题，继续保持！</div>`}</div>${list.length?'<button class="btn" id="reviewWrong" style="width:100%;margin-top:14px">只练错题</button>':''}</div>`}
function me(){return `<div class="shell">${head('我的学习','进度保存在这台手机')}<div class="panel"><div class="setting"><b>📚 已掌握 ${state.learned.length} / ${allWords().length} 词</b><div class="date">今天完成 ${state.todayCount} 次单词练习、${state.quizCount} 道题</div></div><div class="setting"><b>添加自己的单词</b><form class="form" id="addForm" style="margin-top:12px"><input class="field" name="word" placeholder="英文，如 liberty" required autocapitalize="none"><input class="field" name="meaning" placeholder="中文意思" required><button class="btn">加入题库</button></form></div><div class="setting"><b>换手机备份</b><div class="date">仅换手机时使用；“下载备份”会保存 JSON 文件</div><div class="study-actions"><button class="btn secondary" id="export">下载备份</button><label class="btn secondary" style="text-align:center">恢复备份<input id="import" type="file" accept="application/json" hidden></label></div></div><div class="setting"><button class="btn wrong" id="reset" style="width:100%">清空本机进度</button></div></div><div class="panel" style="margin-top:14px"><b>安装到 iPhone 主屏幕</b><p class="date" style="line-height:1.7">用 Safari 打开本页 → 点“分享” → “添加到主屏幕” → 打开“作为网页 App”。之后像普通 App 一样使用。</p></div></div>`}
function render(){const views={home,learn,quiz,wrong,me};$('#app').innerHTML=views[state.tab]();if(state.tab==='me'){const first=$('.panel .setting');if(first)first.insertAdjacentHTML('afterend','<div class="setting"><b>发送学习进度给英语老师</b><div class="date">生成今日学习记录并发送到 ChatGPT；不会下载文件</div><button class="btn" id="syncTeacher" style="width:100%;margin-top:12px">发送到 ChatGPT</button></div><div class="setting"><b>联网更新课程</b><div class="date">当前：'+escapeHtml(state.courseTitle||'基础课程')+' · 已同步至第 '+(state.onlineLesson||0)+' 课</div><button class="btn" id="onlineUpdate" style="width:100%;margin-top:12px">检查并更新</button><label class="btn secondary" style="display:block;text-align:center;margin-top:10px">手动导入课程包<input id="courseImport" type="file" accept="application/json,.json" hidden></label></div>')}renderNav();bind();bindCourseImport()}
function syncReport(){const weak=allWords().filter(w=>(state.wrong[w.word]||0)>0).sort((a,b)=>state.wrong[b.word]-state.wrong[a.word]).slice(0,12).map(w=>w.word).join('、')||'暂无';return `【承希英语学习记录】\n日期：${today()}\n今日单词练习：${state.todayCount} 次\n今日刷题：${state.quizCount} 道\n累计掌握：${state.learned.length}/${allWords().length} 词\n当前易错词：${weak}\n请根据这份记录更新我的学习档案，并安排下一次英语学习。`}
function validateCoursePack(pack){if(!pack||!Array.isArray(pack.words)||!Array.isArray(pack.grammar))throw new Error('invalid');for(const w of pack.words){if(!w.word||!w.meaning)throw new Error('invalid word')}for(const g of pack.grammar){if(!g.q||!g.answer||!Array.isArray(g.options))throw new Error('invalid grammar')}return pack}
function applyCoursePack(pack){validateCoursePack(pack);const lesson=Number(pack.lesson)||0,isNew=lesson>(state.onlineLesson||0);const words=[...(state.lessonWords||[]),...pack.words];const grammar=[...(state.lessonGrammar||[]),...pack.grammar];state.lessonWords=words.filter((w,i,a)=>a.findIndex(x=>x.word===w.word)===i);state.lessonGrammar=grammar.filter((g,i,a)=>a.findIndex(x=>x.q===g.q)===i);state.courseTitle=pack.title||'新课程';state.onlineLesson=Math.max(state.onlineLesson||0,lesson);state.lastOnlineCheck=today();if(isNew){if(state.dailyWords.length){state.previousLessonWords=[...state.dailyWords];state.lessonArchive=[...new Set([...(state.lessonArchive||[]),...state.dailyWords])]}state.dailyWordDate='';state.dailyWords=[];state.dailyPending=[];state.dailyRemembered=[];state.warmupWords=[];state.warmupPending=[];state.vocabPhase='learn';state.quizPending=[];state.quizMistakes=[];state.quizRound=1}save()}
async function checkOnlineCourse(manual=true){const btn=$('#onlineUpdate');if(btn){btn.disabled=true;btn.textContent='正在检查…'}try{const res=await fetch(REMOTE_COURSE_URL+'?t='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('network');const pack=validateCoursePack(await res.json());const lesson=Number(pack.lesson)||0;if(lesson<=(state.onlineLesson||0)){state.lastOnlineCheck=today();save();if(manual)toast('已经是最新课程');if(btn){btn.disabled=false;btn.textContent='检查并更新'}return}applyCoursePack(pack);render();toast(`联网更新成功：${pack.words.length} 个词，${pack.grammar.length} 道语法题`)}catch(e){if(manual)toast('暂时无法联网，请稍后再试');if(btn){btn.disabled=false;btn.textContent='检查并更新'}}}
function bindCourseImport(){const input=$('#courseImport');if(!input)return;input.onchange=async()=>{try{const pack=JSON.parse(await input.files[0].text());applyCoursePack(pack);render();toast(`已更新：${pack.words.length} 个词，${pack.grammar.length} 道语法题`)}catch(e){toast('课程包格式不正确，请重新下载')}}}
function nextStudy(ok){const names=currentStudyList(),name=names[0];if(!name)return;if(state.warmupPending.length){state.warmupPending.shift();state.todayCount++;if(!ok){state.warmupForgotten=[...new Set([...state.warmupForgotten,name])];state.wrong[name]=(state.wrong[name]||0)+2;if(!state.dailyWords.includes(name))state.dailyWords.push(name);if(!state.dailyPending.includes(name))state.dailyPending.push(name)}else state.wrong[name]=Math.max(0,(state.wrong[name]||0)-1)}else{record(name,ok);if(ok){state.dailyPending.shift();state.dailyRemembered=[...new Set([...state.dailyRemembered,name])]}else{state.dailyPending.shift();state.dailyPending.push(name)}if(!state.dailyPending.length){const roundWords=[...state.dailyRemembered];state.dailyRemembered=[];startQuizRound(roundWords)}}revealed=false;save();render()}
function answerQuiz(ans,button){if(answered)return;answered=true;const q=currentQuiz,ok=ans.trim().toLowerCase()===q.answer.toLowerCase();state.quizCount++;if(q.word){record(q.word.word,ok);state.quizPending=state.quizPending.filter(w=>w!==q.word.word);if(!ok)state.quizMistakes=[...new Set([...state.quizMistakes,q.word.word])]}else save();if(button){document.querySelectorAll('.option').forEach(b=>{if(b.dataset.opt===q.answer)b.classList.add('correct')});if(!ok)button.classList.add('wrong')}const f=$('#feedback');const lesson=q.note?`<br><strong>👩‍🏫 老师讲解：</strong>${escapeHtml(q.note)}`:'';f.innerHTML=`<div class="feedback ${ok?'good':'bad'}">${ok?'✅ 正确':'❌ 正确答案：'+escapeHtml(q.answer)}${lesson}</div><button class="btn" id="nextQ" style="width:100%;margin-top:10px">${q.word&&!state.quizPending.length?'查看本轮结果':'下一题'}</button>`;$('#nextQ').onclick=()=>{if(q.word&&!state.quizPending.length)finishQuizRound();currentQuiz=null;answered=false;render()}}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.go;if(state.tab==='quiz')state.mode='challenge';save();render()});document.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>speak(b.dataset.speak));const slow=$('#slowBtn');if(slow)slow.onclick=()=>{const w=wordByName(currentStudyList()[0]);if(w)speak(w.word,true)};const rev=$('#reveal');if(rev)rev.onclick=()=>{revealed=true;render()};document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>nextStudy(b.dataset.rate==='1'));document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;currentQuiz=null;answered=false;save();render()});document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>answerQuiz(b.dataset.opt,b));const ss=$('#submitSpell');if(ss)ss.onclick=()=>answerQuiz($('#spell').value);const sp=$('#spell');if(sp)sp.onkeydown=e=>{if(e.key==='Enter')answerQuiz(sp.value)};const rw=$('#reviewWrong');if(rw)rw.onclick=()=>{const words=allWords().filter(w=>(state.wrong[w.word]||0)>0).map(w=>w.word);state.dailyWords=[...new Set([...state.dailyWords,...words])];state.dailyPending=[...words];state.dailyRemembered=[];state.vocabPhase='relearn';state.tab='learn';save();render()};const sync=$('#syncTeacher');if(sync)sync.onclick=async()=>{const report=syncReport();try{if(navigator.share)await navigator.share({title:'承希英语学习记录',text:report});else throw new Error('share unavailable')}catch(e){if(e.name!=='AbortError'){const ta=document.createElement('textarea');ta.value=report;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('记录已复制，请粘贴到 ChatGPT')}}};const online=$('#onlineUpdate');if(online)online.onclick=()=>checkOnlineCourse(true);const form=$('#addForm');if(form)form.onsubmit=e=>{e.preventDefault();const fd=new FormData(form);const word=fd.get('word').trim().toLowerCase(),meaning=fd.get('meaning').trim();if(allWords().some(x=>x.word===word))return toast('这个词已经在题库里了');state.custom.push({word,meaning,ipa:'',phrase:'你自己添加的单词'});save();form.reset();toast('已加入题库')};const ex=$('#export');if(ex)ex.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'}));a.download='承希英语学习记录.json';a.click();URL.revokeObjectURL(a.href)};const im=$('#import');if(im)im.onchange=async()=>{try{state={...defaultState,...JSON.parse(await im.files[0].text())};save();render();toast('学习记录已恢复')}catch{toast('文件格式不正确')}};const reset=$('#reset');if(reset)reset.onclick=()=>{if(confirm('确定清空全部学习进度吗？')){state={...defaultState};save();render()}}}

render();
if(state.lastOnlineCheck!==today())setTimeout(()=>checkOnlineCourse(false),700);
</script>
