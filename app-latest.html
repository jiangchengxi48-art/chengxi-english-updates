  <style>:root{--ink:#111936;--muted:#6c738e;--paper:#f5f6fb;--card:#fff;--yellow:#ffd166;--mint:#5eead4;--purple:#6d5dfc;--red:#ef5b73;--line:#e7e9f2}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;-webkit-tap-highlight-color:transparent}button,input,select{font:inherit}.shell{max-width:560px;margin:auto;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 18px calc(98px + env(safe-area-inset-bottom))}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.brand{font-size:23px;font-weight:850;letter-spacing:-.5px}.date{font-size:13px;color:var(--muted)}.pill{display:inline-flex;align-items:center;gap:6px;background:#e9e7ff;color:#5141dc;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:750}.hero{background:var(--ink);color:white;padding:22px;border-radius:24px;box-shadow:0 13px 30px #11193622;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:130px;height:130px;border-radius:50%;background:var(--purple);right:-45px;top:-55px}.eyebrow{color:var(--mint);font-size:12px;font-weight:800;letter-spacing:1px}.hero h1{font-size:28px;margin:8px 0 4px;position:relative;z-index:1}.hero p{margin:0;color:#cbd0e1;font-size:14px}.progress{height:9px;background:#313a5b;border-radius:10px;margin:18px 0 8px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--yellow));border-radius:10px}.progress-row{display:flex;justify-content:space-between;font-size:12px;color:#d8dbea}.section-title{display:flex;align-items:end;justify-content:space-between;margin:24px 2px 12px}.section-title h2{margin:0;font-size:19px}.section-title span{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.action{border:0;background:var(--card);border-radius:20px;text-align:left;padding:17px;min-height:126px;box-shadow:0 7px 24px #24305d0d;color:var(--ink)}.action .icon{font-size:26px}.action b{display:block;font-size:16px;margin:12px 0 4px}.action small{color:var(--muted);line-height:1.4}.today-list,.panel{background:var(--card);border-radius:22px;padding:8px 16px;box-shadow:0 7px 24px #24305d0d}.task{display:flex;gap:12px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--line)}.task:last-child{border:0}.check{width:24px;height:24px;border:2px solid #ccd1df;border-radius:8px;display:grid;place-items:center}.check.done{border-color:var(--mint);background:var(--mint)}.task b{display:block;font-size:14px}.task span{font-size:12px;color:var(--muted)}.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,560px);display:grid;grid-template-columns:repeat(5,1fr);background:#fffefcee;border-top:1px solid var(--line);backdrop-filter:blur(18px);padding:8px 5px calc(8px + env(safe-area-inset-bottom));z-index:10}.navbtn{background:none;border:0;color:#8a90a6;font-size:10px;padding:5px 0}.navbtn i{display:block;font-style:normal;font-size:21px;margin-bottom:3px}.navbtn.active{color:var(--purple);font-weight:800}.study-card{background:#fff;border-radius:28px;padding:28px 22px;min-height:390px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 12px 35px #24305d16}.tag{font-size:11px;font-weight:800;padding:6px 10px;border-radius:999px;background:#fff3ce;color:#8b6500}.word{font-size:36px;font-weight:850;margin:22px 0 4px;word-break:break-word}.ipa{color:var(--muted);font-size:16px}.meaning{font-size:23px;font-weight:750;margin:26px 0 8px}.phrase{color:var(--muted)}.hidden{filter:blur(10px);user-select:none}.speak{width:52px;height:52px;border:0;border-radius:50%;background:#e9e7ff;color:var(--purple);font-size:23px;margin-top:19px}.study-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}.btn{border:0;border-radius:16px;padding:15px;font-weight:800;background:var(--ink);color:white}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.wrong{background:#ffe5e9;color:#bb2943}.btn.right{background:#d9fbf3;color:#087763}.quiz-q{font-size:23px;font-weight:800;line-height:1.4;margin:14px 0 22px}.options{display:grid;gap:10px}.option{border:1px solid var(--line);background:#fff;border-radius:16px;padding:16px;text-align:left;color:var(--ink)}.option.correct{background:#d9fbf3;border-color:#5eead4}.option.wrong{background:#ffe5e9;border-color:#ef5b73}.spell-input,.field{width:100%;border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff;color:var(--ink);outline:none}.spell-input{font-size:20px;text-align:center}.feedback{padding:13px;border-radius:14px;margin-top:12px;font-size:14px}.feedback.good{background:#d9fbf3;color:#087763}.feedback.bad{background:#ffe5e9;color:#a8243c}.word-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}.word-row:last-child{border:0}.word-row b{font-size:16px}.word-row span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.mini{border:0;background:#eef0f7;border-radius:12px;padding:9px 12px;color:var(--ink)}.empty{text-align:center;color:var(--muted);padding:48px 10px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tab{border:0;background:#e8eaf2;color:#62697f;padding:9px 13px;border-radius:999px;white-space:nowrap}.tab.active{background:var(--ink);color:white}.form{display:grid;gap:11px}.setting{padding:15px 0;border-bottom:1px solid var(--line)}.setting:last-child{border:0}.toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,20px);background:#111936;color:white;border-radius:13px;padding:11px 16px;opacity:0;pointer-events:none;transition:.25s;z-index:30;font-size:13px}.toast.show{opacity:1;transform:translate(-50%,0)}@media(min-width:600px){.shell{padding-top:30px}}

  <script>window.WORDS = [
['anniversary','/ˌænɪˈvɜːrsəri/','周年纪念日','anniversary celebration','旧词'],

['isolated','/ˈaɪsəleɪtɪd/','孤立的；偏远的','an isolated village','易错'],
['isolate','/ˈaɪsəleɪt/','使隔离；使孤立','isolate the patient','旧词'],
['tuition','/tuˈɪʃn/','学费；教学','tuition fees','旧词'],
['royal','/ˈrɔɪəl/','王室的；皇家的','the royal family','旧词'],
['thorough','/ˈθɜːroʊ/','彻底的；详尽的','a thorough review','旧词'],
['complete','/kəmˈpliːt/','完成；完整的','complete the task','旧词'],
['sophisticated','/səˈfɪstɪkeɪtɪd/','复杂精密的；老练的','sophisticated technology','易错'],
['sophomore','/ˈsɑːfəmɔːr/','大二学生','a college sophomore','旧词'],
['freshman','/ˈfreʃmən/','大一新生','a college freshman','旧词'],
['bias','/ˈbaɪəs/','偏见；偏向','avoid bias','新词'],
['independent','/ˌɪndɪˈpendənt/','独立的；自主的','be independent of','易错'],
['dependent','/dɪˈpendənt/','依赖的；取决于','be dependent on','易错'],
['depend on','/dɪˈpend ɑːn/','依靠；取决于','depend on parents','易错'],
['adequate','/ˈædɪkwət/','足够的；合格的','adequate time','易错'],
['candidate','/ˈkændɪdət/','候选人；应试者','a job candidate','新词'],
['endure','/ɪnˈdʊr/','忍受；持续','endure hardship','新词'],
['liberty','/ˈlɪbərti/','自由','individual liberty','待学'],
['achieve','/əˈtʃiːv/','实现；达到','achieve a goal','核心'],
['benefit','/ˈbenɪfɪt/','益处；使受益','benefit from','核心'],
['challenge','/ˈtʃælɪndʒ/','挑战','face a challenge','核心'],
['consider','/kənˈsɪdər/','考虑；认为','consider doing','核心'],
['develop','/dɪˈveləp/','发展；培养','develop a habit','核心'],
['environment','/ɪnˈvaɪrənmənt/','环境','protect the environment','核心'],
['essential','/ɪˈsenʃl/','必不可少的','be essential for','核心'],
['experience','/ɪkˈspɪriəns/','经历；经验','gain experience','核心'],
['improve','/ɪmˈpruːv/','提高；改善','improve English','核心'],
['influence','/ˈɪnfluəns/','影响','have an influence on','核心'],
['opportunity','/ˌɑːpərˈtuːnəti/','机会','seize an opportunity','核心'],

['require','/rɪˈkwaɪər/','需要；要求','require attention','核心'],
['significant','/sɪɡˈnɪfɪkənt/','重要的；显著的','significant progress','核心'],
['suggest','/səˈdʒest/','建议；表明','suggest doing','核心'],
['increase','/ɪnˈkriːs/','增加；提高','increase rapidly','核心'],
['reduce','/rɪˈduːs/','减少；降低','reduce stress','核心'],
['available','/əˈveɪləbl/','可获得的；有空的','be available to','核心'],
['responsible','/rɪˈspɑːnsəbl/','负责的','be responsible for','核心'],
['attitude','/ˈætɪtuːd/','态度','a positive attitude','核心'],
['ability','/əˈbɪləti/','能力','ability to learn','核心'],
['advantage','/ədˈvæntɪdʒ/','优势；好处','take advantage of','核心'],
['disadvantage','/ˌdɪsədˈvæntɪdʒ/','劣势；缺点','a major disadvantage','核心'],
['education','/ˌedʒuˈkeɪʃn/','教育','higher education','核心'],
['knowledge','/ˈnɑːlɪdʒ/','知识','gain knowledge','核心'],
['practice','/ˈpræktɪs/','练习；实践','practice every day','核心'],
['progress','/ˈprɑːɡres/','进步；进展','make progress','核心'],
['solution','/səˈluːʃn/','解决办法','find a solution','核心'],
['society','/səˈsaɪəti/','社会','modern society','核心']
].map((x,i)=>({id:i+1,word:x[0],ipa:x[1],meaning:x[2],phrase:x[3],tag:x[4]}));

window.GRAMMAR = [
 {q:'I ___ dependent on my parents.', options:['am','is','depend'], answer:'am', note:'dependent 是形容词，I 后面用 am。'},
 {q:'He ___ on his parents.', options:['depends','dependent','is depend'], answer:'depends', note:'depend 是动词；主语 He，要加 s。'},
 {q:'She is ___ of her parents.', options:['independent','depend','independence'], answer:'independent', note:'is 后面用形容词 independent。'},
 {q:'He is ___ candidate.', options:['a','an','不填'], answer:'a', note:'candidate 是可数名词单数，/k/ 是辅音音素，用 a。'},
 {q:'It is ___ adequate solution.', options:['a','an','不填'], answer:'an', note:'adequate 开头是元音音素 /æ/，用 an。'},
 {q:'They ___ independent.', options:['are','is','am'], answer:'are', note:'They 搭配 are。'},
 {q:'Success depends ___ effort.', options:['on','in','at'], answer:'on', note:'固定搭配 depend on。'}
];

  <script>const KEY='chengxiEnglishV1';
const REMOTE_COURSE_URL='https://raw.githubusercontent.com/jiangchengxi48-art/chengxi-english-updates/main/course-latest.json';
const today=()=>new Date().toISOString().slice(0,10);
const defaultState={tab:'home',learned:[],wrong:{annual:2,satisfy:1,dissatisfaction:1,sophisticated:1,dependent:1,independent:1,adequate:1},custom:[],lessonWords:[],lessonGrammar:[],courseTitle:'基础课程',onlineLesson:0,lastOnlineCheck:'',dailyWordDate:'',dailyWords:[],streak:1,lastDay:today(),todayCount:0,quizCount:0,studyIndex:0,mode:'choice'};
let state={...defaultState,...JSON.parse(localStorage.getItem(KEY)||'{}')};
if(state.lastDay!==today()){
  const yesterday=new Date(Date.now()-86400000).toISOString().slice(0,10);
  state.streak=state.lastDay===yesterday?(state.streak||0)+1:1;
  state.lastDay=today();state.todayCount=0;state.quizCount=0;
}
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
const allWords=()=>[...WORDS,...(state.lessonWords||[]).map((x,i)=>({...x,id:500+i,tag:x.tag||'课程'})),...state.custom.map((x,i)=>({...x,id:1000+i,tag:'自加'}))].filter((w,i,a)=>a.findIndex(x=>x.word===w.word)===i);
const allGrammar=()=>[...GRAMMAR,...(state.lessonGrammar||[])].filter((g,i,a)=>a.findIndex(x=>x.q===g.q)===i);
function dailyWordList(){const pool=allWords();const lookup=new Map(pool.map(w=>[w.word,w]));if(state.dailyWordDate===today()&&Array.isArray(state.dailyWords)&&state.dailyWords.length){const kept=state.dailyWords.map(w=>lookup.get(w)).filter(Boolean);if(kept.length)return kept}const picked=[];const add=w=>{if(w&&!picked.some(x=>x.word===w.word)&&picked.length<10)picked.push(w)};pool.filter(w=>(state.wrong[w.word]||0)>0).sort((a,b)=>(state.wrong[b.word]||0)-(state.wrong[a.word]||0)).slice(0,4).forEach(add);(state.lessonWords||[]).map(w=>lookup.get(w.word)).filter(w=>w&&!state.learned.includes(w.word)).forEach(add);pool.filter(w=>!state.learned.includes(w.word)).forEach(add);pool.forEach(add);state.dailyWordDate=today();state.dailyWords=picked.map(w=>w.word);state.studyIndex=0;save();return picked}
const $=s=>document.querySelector(s);
const escapeHtml=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)};
function speak(text,slow=false){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=slow?.62:.86;speechSynthesis.speak(u)}
function record(word,ok){state.todayCount++;if(ok){state.learned=[...new Set([...state.learned,word])];state.wrong[word]=Math.max(0,(state.wrong[word]||0)-1)}else{state.wrong[word]=(state.wrong[word]||0)+2}save()}
function head(title,sub=''){return `<div class="topbar"><div><div class="brand">${title}</div>${sub?`<div class="date">${sub}</div>`:''}</div><span class="pill">🔥 ${state.streak} 天</span></div>`}
const navs=[['home','⌂','今日'],['learn','▣','背词'],['quiz','✎','刷题'],['wrong','↻','错题'],['me','●','我的']];
function renderNav(){ $('#nav').innerHTML=navs.map(([id,ic,tx])=>`<button class="navbtn ${state.tab===id?'active':''}" data-nav="${id}"><i>${ic}</i>${tx}</button>`).join('');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.nav;save();render()}) }
function countdown(){const target=new Date('2026-12-11T09:00:00+08:00');return Math.max(0,Math.ceil((target-new Date())/86400000))}
function home(){const daily=dailyWordList();const pct=Math.min(100,Math.round(state.learned.length/allWords().length*100));return `<div class="shell">${head('早上好，承希','今天也只进步一点点')}<section class="hero"><div class="eyebrow">CET-4 倒计时</div><h1>${countdown()} 天</h1><p>目标：先把词汇和基础语法稳稳拿住</p><div class="progress"><i style="width:${pct}%"></i></div><div class="progress-row"><span>已掌握 ${state.learned.length} 词</span><span>题库 ${allWords().length} 词</span></div></section><div class="section-title"><h2>现在开始</h2><span>今日已练 ${state.todayCount} 次</span></div><div class="grid"><button class="action" data-go="learn"><span class="icon">🧠</span><b>今日背词</b><small>固定 ${daily.length} 个，只反复背今天的词</small></button><button class="action" data-go="quiz"><span class="icon">✍️</span><b>开始刷题</b><small>词义和拼写只考今日 ${daily.length} 词</small></button></div><div class="section-title"><h2>今日计划</h2><span>约 25 分钟</span></div><div class="today-list"><div class="task"><i class="check ${state.todayCount>=daily.length?'done':''}">${state.todayCount>=daily.length?'✓':''}</i><div><b>今日固定 ${daily.length} 词</b><span>当天循环复习，明天自动换词</span></div></div><div class="task"><i class="check ${state.quizCount>=10?'done':''}">${state.quizCount>=10?'✓':''}</i><div><b>刷题 10 道</b><span>今日词汇题＋基础语法题</span></div></div><div class="task"><i class="check"></i><div><b>朗读 5 分钟</b><span>点词卡里的喇叭，慢速跟读</span></div></div></div></div>`}
function studyQueue(){const weighted=[];dailyWordList().forEach(w=>{weighted.push(w);for(let i=0;i<Math.min(2,state.wrong[w.word]||0);i++)weighted.push(w)});return shuffle(weighted)}
let queue=studyQueue(),revealed=false;
function learn(){if(!queue.length)queue=studyQueue();const w=queue[state.studyIndex%queue.length];return `<div class="shell">${head('今日背词',`固定 ${dailyWordList().length} 个词 · 当天循环练习`)}<div class="tabs"><button class="tab active">今日词单</button><button class="tab" id="slowBtn">🐢 慢速朗读</button></div><section class="study-card"><span class="tag">${w.tag}</span><div class="word">${escapeHtml(w.word)}</div><div class="ipa">${w.ipa}</div><button class="speak" data-speak="${escapeHtml(w.word)}">🔊</button><div id="answer" class="${revealed?'':'hidden'}"><div class="meaning">${w.meaning}</div><div class="phrase">${w.phrase}</div></div></section>${revealed?`<div class="study-actions"><button class="btn wrong" data-rate="0">忘记了</button><button class="btn right" data-rate="1">记住了</button></div>`:`<button class="btn" id="reveal" style="width:100%;margin-top:15px">显示答案</button>`}</div>`}
let currentQuiz=null,answered=false;
function makeQuiz(){if(state.mode==='grammar'){const gs=allGrammar(),g=gs[Math.floor(Math.random()*gs.length)];return{type:'grammar',q:g.q,answer:g.answer,note:g.note,options:shuffle(g.options)}}const pool=dailyWordList();const w=pool[Math.floor(Math.random()*pool.length)];if(state.mode==='spell')return{type:'spell',q:w.meaning,answer:w.word,word:w};const opts=shuffle([w,...shuffle(pool.filter(x=>x.word!==w.word)).slice(0,3)]).map(x=>x.meaning);return{type:'choice',q:w.word,answer:w.meaning,word:w,options:opts}}
function quiz(){if(!currentQuiz)currentQuiz=makeQuiz();const q=currentQuiz;let body=q.type==='spell'?`<input id="spell" class="spell-input" placeholder="请输入英文拼写" autocomplete="off" autocapitalize="none"><button class="btn" id="submitSpell" style="width:100%;margin-top:12px">提交答案</button>`:`<div class="options">${q.options.map(o=>`<button class="option" data-opt="${escapeHtml(o)}">${escapeHtml(o)}</button>`).join('')}</div>`;return `<div class="shell">${head('刷题',state.mode==='grammar'?'基础语法单独练习':'只考今日固定词单')}<div class="tabs">${[['choice','今日词义'],['spell','今日拼写'],['grammar','语法']].map(([m,t])=>`<button class="tab ${state.mode===m?'active':''}" data-mode="${m}">${t}</button>`).join('')}</div><section class="panel" style="padding:22px"><span class="tag">${q.type==='grammar'?'基础语法':q.type==='spell'?'今日词：中文写英文':'今日词：英文选中文'}</span><div class="quiz-q">${escapeHtml(q.q)}</div>${body}<div id="feedback"></div></section></div>`}
function wrong(){const list=allWords().filter(w=>(state.wrong[w.word]||0)>0).sort((a,b)=>state.wrong[b.word]-state.wrong[a.word]);return `<div class="shell">${head('错题本',`${list.length} 个词需要回炉`)}<div class="panel">${list.length?list.map(w=>`<div class="word-row"><div><b>${escapeHtml(w.word)}</b><span>${w.meaning} · 错误权重 ${state.wrong[w.word]}</span></div><button class="mini" data-speak="${escapeHtml(w.word)}">🔊</button></div>`).join(''):`<div class="empty">暂时没有错题，继续保持！</div>`}</div>${list.length?'<button class="btn" id="reviewWrong" style="width:100%;margin-top:14px">只练错题</button>':''}</div>`}
function me(){return `<div class="shell">${head('我的学习','进度保存在这台手机')}<div class="panel"><div class="setting"><b>📚 已掌握 ${state.learned.length} / ${allWords().length} 词</b><div class="date">今天完成 ${state.todayCount} 次单词练习、${state.quizCount} 道题</div></div><div class="setting"><b>添加自己的单词</b><form class="form" id="addForm" style="margin-top:12px"><input class="field" name="word" placeholder="英文，如 liberty" required autocapitalize="none"><input class="field" name="meaning" placeholder="中文意思" required><button class="btn">加入题库</button></form></div><div class="setting"><b>换手机备份</b><div class="date">仅换手机时使用；“下载备份”会保存 JSON 文件</div><div class="study-actions"><button class="btn secondary" id="export">下载备份</button><label class="btn secondary" style="text-align:center">恢复备份<input id="import" type="file" accept="application/json" hidden></label></div></div><div class="setting"><button class="btn wrong" id="reset" style="width:100%">清空本机进度</button></div></div><div class="panel" style="margin-top:14px"><b>安装到 iPhone 主屏幕</b><p class="date" style="line-height:1.7">用 Safari 打开本页 → 点“分享” → “添加到主屏幕” → 打开“作为网页 App”。之后像普通 App 一样使用。</p></div></div>`}
function render(){const views={home,learn,quiz,wrong,me};$('#app').innerHTML=views[state.tab]();if(state.tab==='me'){const first=$('.panel .setting');if(first)first.insertAdjacentHTML('afterend','<div class="setting"><b>发送学习进度给英语老师</b><div class="date">生成今日学习记录并发送到 ChatGPT；不会下载文件</div><button class="btn" id="syncTeacher" style="width:100%;margin-top:12px">发送到 ChatGPT</button></div><div class="setting"><b>联网更新课程</b><div class="date">当前：'+escapeHtml(state.courseTitle||'基础课程')+' · 已同步至第 '+(state.onlineLesson||0)+' 课</div><button class="btn" id="onlineUpdate" style="width:100%;margin-top:12px">检查并更新</button><label class="btn secondary" style="display:block;text-align:center;margin-top:10px">手动导入课程包<input id="courseImport" type="file" accept="application/json,.json" hidden></label></div>')}renderNav();bind();bindCourseImport()}
function syncReport(){const weak=allWords().filter(w=>(state.wrong[w.word]||0)>0).sort((a,b)=>state.wrong[b.word]-state.wrong[a.word]).slice(0,12).map(w=>w.word).join('、')||'暂无';return `【承希英语学习记录】\n日期：${today()}\n今日单词练习：${state.todayCount} 次\n今日刷题：${state.quizCount} 道\n累计掌握：${state.learned.length}/${allWords().length} 词\n当前易错词：${weak}\n请根据这份记录更新我的学习档案，并安排下一次英语学习。`}
function validateCoursePack(pack){if(!pack||!Array.isArray(pack.words)||!Array.isArray(pack.grammar))throw new Error('invalid');for(const w of pack.words){if(!w.word||!w.meaning)throw new Error('invalid word')}for(const g of pack.grammar){if(!g.q||!g.answer||!Array.isArray(g.options))throw new Error('invalid grammar')}return pack}
function applyCoursePack(pack){validateCoursePack(pack);const lesson=Number(pack.lesson)||0,isNew=lesson>(state.onlineLesson||0);const words=[...(state.lessonWords||[]),...pack.words];const grammar=[...(state.lessonGrammar||[]),...pack.grammar];state.lessonWords=words.filter((w,i,a)=>a.findIndex(x=>x.word===w.word)===i);state.lessonGrammar=grammar.filter((g,i,a)=>a.findIndex(x=>x.q===g.q)===i);state.courseTitle=pack.title||'新课程';state.onlineLesson=Math.max(state.onlineLesson||0,lesson);state.lastOnlineCheck=today();if(isNew){state.dailyWordDate='';state.dailyWords=[]}queue=studyQueue();save()}
async function checkOnlineCourse(manual=true){const btn=$('#onlineUpdate');if(btn){btn.disabled=true;btn.textContent='正在检查…'}try{const res=await fetch(REMOTE_COURSE_URL+'?t='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('network');const pack=validateCoursePack(await res.json());const lesson=Number(pack.lesson)||0;if(lesson<=(state.onlineLesson||0)){state.lastOnlineCheck=today();save();if(manual)toast('已经是最新课程');if(btn){btn.disabled=false;btn.textContent='检查并更新'}return}applyCoursePack(pack);render();toast(`联网更新成功：${pack.words.length} 个词，${pack.grammar.length} 道语法题`)}catch(e){if(manual)toast('暂时无法联网，请稍后再试');if(btn){btn.disabled=false;btn.textContent='检查并更新'}}}
function bindCourseImport(){const input=$('#courseImport');if(!input)return;input.onchange=async()=>{try{const pack=JSON.parse(await input.files[0].text());applyCoursePack(pack);render();toast(`已更新：${pack.words.length} 个词，${pack.grammar.length} 道语法题`)}catch(e){toast('课程包格式不正确，请重新下载')}}}
function nextStudy(ok){const w=queue[state.studyIndex%queue.length];record(w.word,ok);state.studyIndex++;revealed=false;save();render()}
function answerQuiz(ans,button){if(answered)return;answered=true;const q=currentQuiz,ok=ans.trim().toLowerCase()===q.answer.toLowerCase();state.quizCount++;if(q.word)record(q.word.word,ok);else save();if(button){document.querySelectorAll('.option').forEach(b=>{if(b.dataset.opt===q.answer)b.classList.add('correct')});if(!ok)button.classList.add('wrong')}const f=$('#feedback');f.innerHTML=`<div class="feedback ${ok?'good':'bad'}">${ok?'✅ 正确':'❌ 正确答案：'+escapeHtml(q.answer)}${q.note?'<br>'+q.note:''}</div><button class="btn" id="nextQ" style="width:100%;margin-top:10px">下一题</button>`;$('#nextQ').onclick=()=>{currentQuiz=null;answered=false;render()}}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.go;save();render()});document.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>speak(b.dataset.speak));const slow=$('#slowBtn');if(slow)slow.onclick=()=>{const w=queue[state.studyIndex%queue.length];speak(w.word,true)};const rev=$('#reveal');if(rev)rev.onclick=()=>{revealed=true;render()};document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>nextStudy(b.dataset.rate==='1'));document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;currentQuiz=null;answered=false;save();render()});document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>answerQuiz(b.dataset.opt,b));const ss=$('#submitSpell');if(ss)ss.onclick=()=>answerQuiz($('#spell').value);const sp=$('#spell');if(sp)sp.onkeydown=e=>{if(e.key==='Enter')answerQuiz(sp.value)};const rw=$('#reviewWrong');if(rw)rw.onclick=()=>{queue=allWords().filter(w=>(state.wrong[w.word]||0)>0);state.studyIndex=0;state.tab='learn';render()};const sync=$('#syncTeacher');if(sync)sync.onclick=async()=>{const report=syncReport();try{if(navigator.share)await navigator.share({title:'承希英语学习记录',text:report});else throw new Error('share unavailable')}catch(e){if(e.name!=='AbortError'){const ta=document.createElement('textarea');ta.value=report;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('记录已复制，请粘贴到 ChatGPT')}}};const online=$('#onlineUpdate');if(online)online.onclick=()=>checkOnlineCourse(true);const form=$('#addForm');if(form)form.onsubmit=e=>{e.preventDefault();const fd=new FormData(form);const word=fd.get('word').trim().toLowerCase(),meaning=fd.get('meaning').trim();if(allWords().some(x=>x.word===word))return toast('这个词已经在题库里了');state.custom.push({word,meaning,ipa:'',phrase:'你自己添加的单词'});save();form.reset();toast('已加入题库')};const ex=$('#export');if(ex)ex.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'}));a.download='承希英语学习记录.json';a.click();URL.revokeObjectURL(a.href)};const im=$('#import');if(im)im.onchange=async()=>{try{state={...defaultState,...JSON.parse(await im.files[0].text())};save();render();toast('学习记录已恢复')}catch{toast('文件格式不正确')}};const reset=$('#reset');if(reset)reset.onclick=()=>{if(confirm('确定清空全部学习进度吗？')){state={...defaultState};save();render()}}}

render();
if(state.lastOnlineCheck!==today())setTimeout(()=>checkOnlineCourse(false),700);
</script>
</body>
</html>
