function fullPlanCourses(){const words=state.fullCETWords||[],out=[];for(let i=0;i<words.length;i+=FULL_WORDS_PER_DAY)out.push({day:out.length+1,words:words.slice(i,i+FULL_WORDS_PER_DAY)});return out}
function nextFullPlanDay(){const total=fullPlanCourses().length,done=state.completedFullDays||[];for(let d=1;d<=total;d++)if(!done.includes(d))return d;return total||1}
function dailyWordList(){const pool=allWords(),lookup=new Map(pool.map(w=>[w.word,w]));if(state.dailyWordDate===today()&&Array.isArray(state.dailyWords)&&state.dailyWords.length){const kept=state.dailyWords.map(w=>lookup.get(w)).filter(Boolean);if(kept.length)return kept}let course=COURSE_CATALOG.find(c=>c.id===Number(state.selectedCourse)),picked=[];if(state.fullPlanMode&&(state.fullCETWords||[]).length){let day=Number(state.fullPlanDay)||nextFullPlanDay();if((state.completedFullDays||[]).includes(day))day=nextFullPlanDay();const plan=fullPlanCourses().find(x=>x.day===day);state.fullPlanDay=day;course=null;(plan?.words||[]).forEach(w=>picked.push(w));state.courseTitle=`完整词汇 Day ${day}`}
else if(course)course.words.map(w=>lookup.get(w)).filter(Boolean).forEach(w=>picked.push(w));else{const add=w=>{if(w&&!picked.some(x=>x.word===w.word)&&picked.length<10)picked.push(w)};pool.filter(w=>(state.wrong[w.word]||0)>0).sort((a,b)=>(state.wrong[b.word]||0)-(state.wrong[a.word]||0)).slice(0,4).forEach(add);pool.filter(w=>!state.learned.includes(w.word)).forEach(add);pool.forEach(add)}state.dailyWordDate=today();state.dailyWords=picked.map(w=>w.word);if(!state.fullPlanMode)state.courseTitle=course?.title||state.courseTitle;state.dailyPending=[...state.dailyWords];state.dailyRemembered=[];state.vocabPhase='learn';state.quizPending=[];state.quizMistakes=[];state.quizRound=1;state.studyIndex=0;save();return picked}

function logWord(word,type,ok){state.todayWordStats=state.todayWordStats||{};const s=state.todayWordStats[word]||{learnOk:0,learnForget:0,quizOk:0,quizWrong:0,warmupOk:0,warmupForget:0,bedtimeOk:0,bedtimeForget:0};const keys={learn:['learnForget','learnOk'],quiz:['quizWrong','quizOk'],warmup:['warmupForget','warmupOk'],bedtime:['bedtimeForget','bedtimeOk']};const key=(keys[type]||keys.learn)[ok?1:0];s[key]=(s[key]||0)+1;state.todayWordStats[word]=s}

 {id:'g6',stage:'语法',title:'从句、连接词与长难句',minutes:35,goal:'按连接词拆开四级长句。',points:['先找每个分句的主语和谓语。','because表示原因，although表示让步，which/that常引导定语从句。','长句先读主干，再补修饰信息。'],examples:['Although it was difficult, she continued. 虽然困难，她仍继续。','The book that I bought is useful. 我买的那本书很有用。','We study because knowledge creates opportunities. 我们学习，因为知识创造机会。'],practice:['表示原因：because','表示转折让步：although','修饰前面名词：that/which从句']},
 {id:'l1',stage:'听力',title:'听力入门：辨音与关键词',minutes:25,goal:'不追求听懂每个词，先抓人物、地点、数字和动作。',points:['播放前先看选项，预测要听的信息。','第一遍抓名词和动词，第二遍确认否定词与数字。','but、however后通常出现真正重点。'],audio:'The woman planned to take the bus, but she finally went to school by train.',examples:['关键词：woman / bus / but / train','答案应围绕“最后乘火车”，不是最先计划的公交车。'],practice:['最终交通方式是什么？→ train','转折信号词是什么？→ but']},
 {id:'l2',stage:'听力',title:'短对话：场景与意图',minutes:30,goal:'根据语气和场景判断说话人的真正意思。',points:['常见场景：校园、图书馆、商店、医院和交通。','注意建议、拒绝、同意和抱怨的表达。','答案通常是同义改写，不会原词照抄。'],audio:'I would love to join you, but I have to finish my report tonight.',examples:['would love to表示愿意；but后说明不能参加。','正确理解：说话人因为要完成报告而拒绝邀请。'],practice:['说话人的决定？→ 不参加','原因？→ 要完成报告']},
 {id:'l3',stage:'听力',title:'长对话与篇章：边听边定位',minutes:35,goal:'用题目顺序跟随录音信息。',points:['题目一般按照录音内容顺序出现。','每答完一题立刻看下一题，不回想上一题。','记录人名首字母、数字和因果箭头即可。'],audio:'Many students find regular review more effective than studying everything before an exam. Short daily practice reduces stress and improves memory.',examples:['主题：regular review','原因：reduces stress / improves memory'],practice:['文章推荐什么方法？→ 每天短时间复习','这种方法的两个好处？→ 减压、改善记忆']},
 {id:'r1',stage:'阅读',title:'选词填空：先判词性',minutes:30,goal:'先判断空格需要名词、动词、形容词还是副词。',points:['先给选项标注n./v./adj./adv.。','再看空格前后的语法位置。','最后结合句意排除，不能只看中文。'],examples:['an ___ solution → 需要形容词 adequate','can ___ ability → 需要动词 improve'],practice:['The change is ___. significant/significantly → significant','It changed ___. significant/significantly → significantly']},
 {id:'r2',stage:'阅读',title:'段落匹配：定位而非全文翻译',minutes:30,goal:'利用专有名词、数字和同义词快速找段落。',points:['先读题干并圈出不容易替换的定位词。','回文章找同义改写，不要求逐句翻译。','一段可能对应多题，也可能不使用。'],examples:['题干increase efficiency；原文improve productivity，属于同义改写。','题干in 2025；数字2025是强定位词。'],practice:['先圈出：人名、年份、地点、专业术语','找到后只精读定位句前后各一句']},
 {id:'r3',stage:'阅读',title:'仔细阅读：题干、定位、排除',minutes:38,goal:'按题目顺序定位并识别干扰项。',points:['先读题干，不先看四个选项。','定位后比较原文意思，不凭常识选择。','包含绝对词always/never的选项要特别谨慎。'],examples:['原文some students，选项all students属于扩大范围。','原文may，选项must属于语气过强。'],practice:['范围扩大是常见干扰','偷换对象是常见干扰','原文没有的信息不能靠常识补充']},
 {id:'w1',stage:'写作',title:'四级作文三段式骨架',minutes:35,goal:'完成开头—论证—结尾的清晰结构。',points:['第一段改写题目并给出观点。','第二段写两个理由，每个理由补解释或例子。','第三段总结并给出建议。'],examples:['It is widely believed that learning habits influence our progress.','First, regular review improves memory. Moreover, it reduces stress.','In conclusion, we should develop an effective study plan.'],practice:['主题：The importance of regular exercise','写1句观点＋2个理由＋1句建议']},
 {id:'w2',stage:'写作',title:'连接词、原因与举例',minutes:32,goal:'避免句子堆砌，让作文逻辑连贯。',points:['列举：first、moreover、finally。','原因结果：because、therefore、as a result。','举例：for example；转折：however。'],examples:['Exercise is essential because it improves health.','For example, walking for thirty minutes can reduce stress.','Therefore, students should exercise regularly.'],practice:['用because连接原因','用for example补一个例子','用therefore写结论']},
 {id:'t1',stage:'翻译',title:'翻译入门：先主干后修饰',minutes:32,goal:'把中文长句拆成英语短句。',points:['先确定谁做什么，再补时间、地点和方式。','不要逐字翻译；先表达核心意思。','没有把握时优先使用简单正确的句型。'],examples:['中国学生越来越重视英语学习。→ Chinese students pay increasing attention to English learning.','阅读能够帮助人们获得知识。→ Reading helps people gain knowledge.'],practice:['先圈中文主语','确定核心动词','最后加入时间地点']},
 {id:'t2',stage:'翻译',title:'中国文化与社会主题表达',minutes:35,goal:'积累四级翻译常见主题词和安全句型。',points:['常见主题：传统节日、教育、交通、科技和环境。','不会的专有名词可用解释性表达。','统一时态并检查单复数。'],examples:['春节是中国最重要的传统节日之一。→ The Spring Festival is one of the most important traditional festivals in China.','高铁给人们的出行带来了便利。→ High-speed rail has made travel more convenient.'],practice:['one of后接复数名词','“越来越”可用more and more','完成后检查冠词与复数']},
 {id:'e1',stage:'应试',title:'分项诊断与时间分配',minutes:25,goal:'按真实题型找出最弱部分。',points:['写作30分钟后立即进入听力。','阅读部分先做优势题型，避免卡在一个空格。','翻译保留检查时间，优先保证句子完整。'],examples:['听力与阅读各占35%，写作和翻译合计30%。','错题要标记原因：词汇、语法、定位或时间。'],practice:['完成一次分项计时','记录每类正确率','把最低项加入下周重点']},
 {id:'e2',stage:'应试',title:'整套模拟与考前复盘',minutes:140,goal:'在完整考试时间内稳定完成一套卷。',points:['严格计时，中途不查词。','完成后不仅对答案，还要重做所有错题。','统计听力、阅读、写译三项，下一轮只补最弱项。'],examples:['错误记录：题号＋我的答案＋正确答案＋错误原因。','连续两套达到目标后，再提高速度而不是盲目加题。'],practice:['完成一套完整模拟','当天订正','第二天无答案重做错题']}
];
const EXTRA_SKILL_COURSES=[
 {id:'g7',stage:'语法',title:'人称代词与物主代词',minutes:25,goal:'分清I/me、he/him、my/mine等常见代词。',points:['主语位置用I/he/she/we/they。','动词或介词后用me/him/her/us/them。','名词前用my/your/his/her；后面没有名词时可用mine/yours。'],examples:['She helps me every day. 她每天帮助我。','This is my book, and that one is yours. 这是我的书，那本是你的。'],practice:['___ am a student. I/me → I','She talks to ___. he/him → him'],quiz:[{q:'This book belongs to ___.',options:['I','me','my'],answer:'me',note:'介词to后使用宾格me。'}]},
 {id:'g8',stage:'语法',title:'形容词与副词',minutes:28,goal:'判断修饰名词、动词和整个句子时该用哪种形式。',points:['形容词修饰名词或放在be后。','副词通常修饰动词、形容词或整个句子。','很多副词由形容词加-ly构成，但fast等形式不变。'],examples:['She is a careful student. 她是一个认真的学生。','She reads carefully. 她读得很认真。'],practice:['a ___ answer: correct/correctly → correct','answer ___: correct/correctly → correctly'],quiz:[{q:'He completed the work ___.',options:['careful','carefully','care'],answer:'carefully',note:'这里修饰动词completed，所以用副词。'}]},
 {id:'g9',stage:'语法',title:'比较级与最高级',minutes:28,goal:'会表达更……和最……。',points:['短词常加-er/-est，长词常用more/most。','比较级常与than连用。','最高级前通常加the。'],examples:['This method is more effective than that one. 这个方法比那个更有效。','She is the most careful student in the class. 她是班里最认真的学生。'],practice:['更重要 → more important','三者中最快 → the fastest'],quiz:[{q:'Regular review is ___ than last-minute study.',options:['effective','more effective','most effective'],answer:'more effective',note:'句中有than，要用比较级。'}]},
 {id:'g10',stage:'语法',title:'现在完成时',minutes:30,goal:'理解have/has done表示过去动作与现在的联系。',points:['结构是have/has＋过去分词。','常和already、yet、since、for连用。','强调经历或持续到现在，不只说过去时间。'],examples:['I have finished my homework. 我已经完成作业了。','She has studied English for two years. 她学英语两年了。'],practice:['He ___ finished. has/have → has','for two years表示一段时间'],quiz:[{q:'She ___ already completed the task.',options:['has','have','is'],answer:'has',note:'主语She搭配has，后接过去分词completed。'}]},
 {id:'g11',stage:'语法',title:'不定式与动名词',minutes:32,goal:'掌握to do、doing的常见固定搭配。',points:['want/hope/plan后常接to do。','enjoy/avoid/consider/suggest后常接doing。','介词后通常接名词或doing。'],examples:['I plan to improve my English. 我计划提高英语。','She enjoys reading. 她喜欢阅读。'],practice:['consider ___: doing','hope ___: to do'],quiz:[{q:'I suggest ___ every morning.',options:['practicing','to practice','practice to'],answer:'practicing',note:'suggest后接动名词doing。'}]},
 {id:'g12',stage:'语法',title:'定语从句基础',minutes:32,goal:'看懂who/which/that连接的修饰信息。',points:['先找到被修饰的名词，也叫先行词。','who常指人，which常指物，that两者都可。','先读主句，再把从句当作对名词的补充。'],examples:['The student who answered the question is my friend. 回答问题的学生是我的朋友。','The book that I bought is useful. 我买的书很有用。'],practice:['指人常用who','指物常用which/that'],quiz:[{q:'The book ___ I bought is useful.',options:['that','who','where'],answer:'that',note:'先行词book指物，可使用that。'}]},
 {id:'g13',stage:'语法',title:'状语从句与逻辑关系',minutes:32,goal:'识别原因、条件、时间和让步关系。',points:['because表示原因，if表示条件。','when/while表示时间，although表示让步。','先圈连接词，再分别找两个分句的主谓。'],examples:['Although it was raining, we continued. 虽然下雨，我们仍继续。','If you review regularly, you will remember more. 如果定期复习，你会记得更多。'],practice:['原因 → because','条件 → if','让步 → although'],quiz:[{q:'___ it was difficult, she did not give up.',options:['Although','Because of','If of'],answer:'Although',note:'前后形成让步关系，用Although引导从句。'}]},
 {id:'g14',stage:'语法',title:'被动语态完整训练',minutes:32,goal:'掌握be done并判断动作执行者是否重要。',points:['结构是be＋过去分词。','be随时态变化：is done、was done、has been done。','强调承受动作的人或物时使用被动。'],examples:['The bridge was built in 2010. 这座桥建于2010年。','English is spoken in many countries. 很多国家使用英语。'],practice:['过去被完成 → was completed','现在被使用 → is used'],quiz:[{q:'The report ___ yesterday.',options:['was completed','completed','is complete by'],answer:'was completed',note:'报告是被完成，且时间是yesterday，因此用一般过去时被动。'}]},
 {id:'l4',stage:'听力',title:'数字、时间与地点',minutes:28,goal:'稳定听出时间、价格、日期和地点变化。',points:['先看选项中的数字差异。','注意thirteen/thirty等易混读音。','时间和地点常在转折后被修改。'],audio:'The meeting was first planned for three thirty, but it will now begin at four fifteen in Room 205.',examples:['先计划3:30，实际4:15。','地点是Room 205。'],practice:['实际开始时间？→ 4:15','地点？→ Room 205'],quiz:[{q:'When will the meeting begin?',options:['3:30','4:15','2:05'],answer:'4:15',note:'but后给出了最终时间。'}]},
 {id:'l5',stage:'听力',title:'否定、转折与真实意图',minutes:30,goal:'听懂not、hardly、but和间接拒绝。',points:['but/however后往往是答案重点。','hardly表示几乎不，不是努力地。','I would love to...but...通常表示礼貌拒绝。'],audio:'I would love to attend the lecture, but I have not finished my paper, so I will stay in the library.',examples:['态度：想去但最终不去。','原因：论文没完成。'],practice:['最终在哪里？→ library','有没有参加讲座？→ 没有'],quiz:[{q:'What will the speaker probably do?',options:['Attend the lecture','Stay in the library','Go home'],answer:'Stay in the library',note:'but和so之后说明最终决定。'}]},
 {id:'l6',stage:'听力',title:'短篇新闻：首句与要素',minutes:32,goal:'抓住新闻的谁、何时、何地、发生什么。',points:['新闻首句通常概括核心事件。','重点记录主体、动作、地点和数字。','不熟悉的人名无需逐字拼写。'],audio:'A university in eastern China has opened a new learning center. The center provides free digital courses to local residents and will serve about two thousand people each year.',examples:['主体：a university。','事件：opened a learning center。','受益者：local residents。'],practice:['中心提供什么？→ free digital courses','预计每年服务多少人？→ about 2,000'],quiz:[{q:'What does the new center provide?',options:['Free digital courses','Paid housing','Medical care'],answer:'Free digital courses',note:'录音第二句直接给出服务内容。'}]},
 {id:'l7',stage:'听力',title:'校园长对话',minutes:35,goal:'跟随人物、问题、建议和最后决定。',points:['给两位说话人分别记M/W或A/B。','重点听问题—建议—决定。','最后一句经常说明下一步行动。'],audio:'Student: I am having trouble with my research report. Teacher: Start by narrowing your topic and make an outline. Student: That makes sense. I will revise the outline tonight and bring it tomorrow.',examples:['问题：research report。','建议：narrow the topic and make an outline。','决定：今晚修改提纲。'],practice:['老师建议的第一步？→ narrow the topic','学生今晚做什么？→ revise the outline'],quiz:[{q:'What will the student do tonight?',options:['Revise the outline','Change the teacher','Submit the final report'],answer:'Revise the outline',note:'对话最后明确说明今晚修改提纲。'}]},
 {id:'l8',stage:'听力',title:'篇章主旨与因果',minutes:36,goal:'听出主题句、原因和结论，不被细节拖住。',points:['开头和结尾优先记录。','because、therefore、as a result连接因果。','题目问mainly about时选择概括度合适的答案。'],audio:'Regular exercise benefits students in several ways. It improves concentration, reduces stress, and helps them sleep better. Therefore, even a short daily walk can support both learning and health.',examples:['主题：exercise benefits students。','三个好处：专注、减压、睡眠。'],practice:['主旨？→ 运动对学生的好处','建议？→ daily walk'],quiz:[{q:'What is the passage mainly about?',options:['Benefits of regular exercise','How to pass an exam','Problems with walking'],answer:'Benefits of regular exercise',note:'首句提出主题，后文均在说明运动的好处。'}]},
 {id:'r4',stage:'阅读',title:'语境猜词',minutes:30,goal:'不会某个词时仍能利用上下文继续阅读。',points:['先判断生词词性和感情色彩。','寻找同义解释、举例和转折。','只需得到适合当前句子的意思。'],passage:'Some students postpone their work; in other words, they delay starting it until the last moment.',examples:['in other words后是解释。','postpone≈delay。'],practice:['postpone在此处是什么意思？→ 推迟'],quiz:[{q:'What does “postpone” most likely mean?',options:['Delay','Finish','Improve'],answer:'Delay',note:'分号后的in other words给出了同义解释。'}]},
 {id:'r5',stage:'阅读',title:'事实题与推断题',minutes:34,goal:'区分原文直接信息和有证据的推断。',points:['事实题要与原文一一对应。','推断必须基于原文，不能依靠个人常识。','may/suggest通常比must/prove更符合推断语气。'],passage:'Li reviews vocabulary for fifteen minutes each morning. After two months, she can understand more of her reading materials and feels less nervous in class.',examples:['事实：每天复习15分钟。','可推断：短时规律复习对她有效。'],practice:['不能推断她每天学习两小时'],quiz:[{q:'What can be inferred about Li?',options:['Regular review has helped her','She studies two hours daily','She no longer needs English'],answer:'Regular review has helped her',note:'理解增加、紧张减少支持这一推断。'}]},
 {id:'r6',stage:'阅读',title:'作者态度与写作目的',minutes:34,goal:'通过评价词和结尾判断作者态度。',points:['positive/negative/neutral是常见态度。','注意valuable、worrying、should等评价词。','写作目的可能是介绍、说服、批评或比较。'],passage:'Online learning offers valuable flexibility, but it also requires strong self-discipline. Students should choose tools carefully and keep a regular schedule.',examples:['作者既说优点也提醒条件。','整体态度是balanced。'],practice:['作者目的？→ 客观分析并提出建议'],quiz:[{q:'What is the author’s attitude toward online learning?',options:['Balanced','Completely negative','Unquestionably excited'],answer:'Balanced',note:'作者同时提到灵活性和自律要求。'}]},
 {id:'r7',stage:'阅读',title:'长篇匹配实战',minutes:36,goal:'用题干关键词和同义替换快速定位段落。',points:['先读10个题干，再读文章。','圈出数字、人名、地点和核心概念。','找到定位句后核对主语与范围。'],passage:'Paragraph A: The library extended its opening hours. Paragraph B: A new app helps students reserve seats. Paragraph C: Weekend workshops teach research skills.',examples:['reserve a place≈book a seat。','learn how to find sources≈research skills。'],practice:['周末学习检索技能 → C','手机预订座位 → B'],quiz:[{q:'Which paragraph mentions booking a place by phone?',options:['A','B','C'],answer:'B',note:'app和reserve seats对应手机预订座位。'}]},
 {id:'r8',stage:'阅读',title:'仔细阅读综合训练',minutes:40,goal:'完成主旨、细节、推断和词义四类题。',points:['先读题干，按顺序定位。','每题必须在原文中找到证据。','做完标注错误属于词汇、定位还是逻辑。'],passage:'Many colleges encourage students to join volunteer programs. These activities help communities, while students gain practical experience and learn to cooperate with others. However, students should balance volunteer work with their studies.',examples:['好处：experience and cooperation。','限制：balance with studies。'],practice:['主旨：志愿活动的益处与平衡','however后是提醒'],quiz:[{q:'What does the passage advise students to do?',options:['Balance volunteering and study','Avoid volunteer work','Leave college early'],answer:'Balance volunteering and study',note:'最后一句直接给出建议。'}]},
 {id:'w3',stage:'写作',title:'从简单句到扩展句',minutes:30,goal:'用原因、例子和结果把短句扩展清楚。',points:['先保证主谓完整。','再用because补原因。','用for example举例，用therefore给结果。'],examples:['Exercise is useful because it reduces stress.','For example, a short walk can improve concentration.'],practice:['把Reading is important扩展成原因句'],assignment:'请写3句话：观点＋because原因＋for example例子。',quiz:[{q:'Which sentence is complete and logical?',options:['Exercise useful because health.','Exercise is useful because it improves health.','Because exercise and health.'],answer:'Exercise is useful because it improves health.',note:'句子主谓完整，并用because连接原因。'}]},
 {id:'w4',stage:'写作',title:'四级写作常见错误',minutes:32,goal:'检查主谓一致、时态、冠词和中式英语。',points:['每句先检查有没有谓语。','单数主语的一般现在时动词常加-s。','避免逐字翻译，优先写简单正确句。'],examples:['错误: He study every day. 正确: He studies every day.','错误: I very like it. 正确: I like it very much.'],practice:['改错：She have a plan. → She has a plan.'],assignment:'写5个简单句，并逐句检查主语、谓语、时态和冠词。',quiz:[{q:'Choose the correct sentence.',options:['She have made progress.','She has made progress.','She has make progress.'],answer:'She has made progress.',note:'现在完成时为has＋过去分词made。'}]},

function ensureBedtime(){dailyWordList();state.bedtimeReviewed=state.bedtimeReviewed||[];const xyToday=xyTodayNames(),xyOrdered=(state.xiaoyanWords||[]).filter(w=>xyToday.includes(w.word)).sort((a,b)=>(a.mastery||0)-(b.mastery||0)||(b.wrong||0)-(a.wrong||0)).map(w=>w.word),regular=[...state.dailyWords,...allWords().filter(w=>(state.wrong[w.word]||0)>0).sort((a,b)=>state.wrong[b.word]-state.wrong[a.word]).slice(0,4).map(w=>w.word)],all=[...new Set([...xyOrdered,...regular])];if(state.bedtimeDate!==today()){state.bedtimeDate=today();state.bedtimeReviewed=[];state.bedtimePending=all;state.bedtimeDoneDate=''}else{const added=all.filter(w=>!state.bedtimePending.includes(w)&&!state.bedtimeReviewed.includes(w));if(added.length){state.bedtimePending=[...added,...state.bedtimePending];state.bedtimeDoneDate=''}}save()}

function addManualWord(form){const fd=new FormData(form),word=fd.get('word').trim().toLowerCase(),meaning=fd.get('meaning').trim();if(!word||!meaning)return;dailyWordList();let known=wordByName(word);if(!known){state.custom.push({word,meaning,ipa:'',phrase:'你今天添加的单词',tag:'今日自加'});known=wordByName(word)}if(state.dailyWords.includes(word)){form.reset();toast('这个词已经在今日课程里了');return}state.dailyWords.push(word);state.dailyPending=[...new Set([...(state.dailyPending||[]),word])];state.dailyRemembered=(state.dailyRemembered||[]).filter(w=>w!==word);if(state.vocabPhase==='quiz'||state.vocabPhase==='complete'){state.vocabPhase='learn';state.quizPending=[];state.quizMistakes=[];state.quizRound=1}state.wrong[word]=Math.max(1,state.wrong[word]||0);save();form.reset();toast(`${word} 已加入今日课程`)}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.go;if(state.tab==='quiz')state.mode='challenge';save();render()});document.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>speak(b.dataset.speak));document.querySelectorAll('[data-speak-slow]').forEach(b=>b.onclick=()=>speak(b.dataset.speakSlow,true));const slow=$('#slowBtn');if(slow)slow.onclick=()=>{const w=wordByName(currentStudyList()[0]);if(w)speak(w.word,true)};const enrich=$('#enrichWord');if(enrich)enrich.onclick=()=>enrichWord(enrich.dataset.word,true);const rev=$('#reveal');if(rev)rev.onclick=()=>{const w=wordByName(currentStudyList()[0]);revealed=true;render();if(w&&!(state.dictionaryCache||{})[w.word])setTimeout(()=>enrichWord(w.word,false),80)};document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>nextStudy(b.dataset.rate==='1'));document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;currentQuiz=null;answered=false;save();render()});document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>answerQuiz(b.dataset.opt,b));document.querySelectorAll('[data-skill-answer]').forEach(b=>b.onclick=()=>answerSkillQuestion(b.dataset.skillAnswer,Number(b.dataset.qIndex),b.dataset.answer));const draft=$('#skillDraft');if(draft)draft.oninput=()=>{state.skillDrafts=state.skillDrafts||{};state.skillDrafts[draft.dataset.courseId]=draft.value;save()};const ss=$('#submitSpell');if(ss)ss.onclick=()=>answerQuiz($('#spell').value);const sp=$('#spell');if(sp)sp.onkeydown=e=>{if(e.key==='Enter')answerQuiz(sp.value)};const rw=$('#reviewWrong');if(rw)rw.onclick=()=>{const words=allWords().filter(w=>(state.wrong[w.word]||0)>0).map(w=>w.word);state.dailyWords=[...new Set([...state.dailyWords,...words])];state.dailyPending=[...words];state.dailyRemembered=[];state.vocabPhase='relearn';state.tab='learn';save();render()};const sync=$('#syncTeacher');if(sync)sync.onclick=async()=>{const report=syncReport();try{if(navigator.share)await navigator.share({title:'承希英语学习记录',text:report});else throw new Error('share unavailable')}catch(e){if(e.name!=='AbortError'){const ta=document.createElement('textarea');ta.value=report;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('记录已复制，请粘贴到 ChatGPT')}}};const online=$('#onlineUpdate');if(online)online.onclick=()=>checkOnlineCourse(true);const form=$('#addForm');if(form)form.onsubmit=e=>{e.preventDefault();const fd=new FormData(form);const word=fd.get('word').trim().toLowerCase(),meaning=fd.get('meaning').trim();if(allWords().some(x=>x.word===word))return toast('这个词已经在题库里了');state.custom.push({word,meaning,ipa:'',phrase:'你自己添加的单词'});save();form.reset();toast('已加入题库')};const ex=$('#export');if(ex)ex.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'}));a.download='承希英语学习记录.json';a.click();URL.revokeObjectURL(a.href)};const im=$('#import');if(im)im.onchange=async()=>{try{state={...defaultState,...JSON.parse(await im.files[0].text())};save();render();toast('学习记录已恢复')}catch{toast('文件格式不正确')}};const reset=$('#reset');if(reset)reset.onclick=()=>{if(confirm('确定清空全部学习进度吗？')){state={...defaultState};save();render()}}}

document.addEventListener('click',e=>{const lookup=e.target.closest?.('[data-lookup]');if(lookup)showLookup(lookup.dataset.lookup);const add=e.target.closest?.('[data-add-word]');if(add)addLookupWord(add.dataset.addWord);if(e.target.id==='closeLookup'||e.target.id==='closeLookup2'||e.target.id==='lookupMask')document.querySelector('.lookup-mask')?.remove();const course=e.target.closest?.('[data-course]');if(course)selectCourse(course.dataset.course);if(e.target.id==='startGrammar')startGrammarPractice();if(e.target.id==='restartGrammar'){state.grammarReady=false;state.grammarPending=[];state.grammarMistakes=[];state.grammarCompletedDate='';currentQuiz=null;answered=false;save();render()}if(e.target.id==='revealBedtime'){bedtimeRevealed=true;render()}const bedtimeBtn=e.target.closest?.('[data-bedtime]');if(bedtimeBtn)nextBedtime(bedtimeBtn.dataset.bedtime==='1')});
document.addEventListener('click',e=>{const full=e.target.closest?.('[data-full-day]');if(full)selectFullCourse(full.dataset.fullDay);if(e.target.id==='loadFullWords')loadFullCETWords(true);const skill=e.target.closest?.('[data-skill]');if(skill){state.activeSkillCourse=skill.dataset.skill;state.tab='skill';save();render()}if(e.target.id==='finishSkill'){const id=state.activeSkillCourse,c=SKILL_COURSES.find(x=>x.id===id),status=c?skillQuizStatus(c):{passed:true,correct:0,total:0},wasDone=(state.completedSkillCourses||[]).includes(id);if(!status.passed)return toast('请先把本课测验全部做对');state.completedSkillCourses=[...new Set([...(state.completedSkillCourses||[]),id])];state.stageScores=state.stageScores||{};if(c&&status.total&&!wasDone)state.stageScores[c.stage]={correct:(state.stageScores[c.stage]?.correct||0)+status.correct,total:(state.stageScores[c.stage]?.total||0)+status.total};state.tab='courses';save();render();toast('本课已完成')}});
document.addEventListener('submit',e=>{if(e.target.id==='addForm'){e.preventDefault();e.stopImmediatePropagation();addManualWord(e.target)}},true);
document.addEventListener('submit',e=>{if(e.target.id==='xyAddForm'){e.preventDefault();e.stopImmediatePropagation();addXYWord(e.target)}},true);
document.addEventListener('click',e=>{const batch=e.target.closest?.('[data-xy-batch]');if(batch)startXYBatch(batch.dataset.xyBatch,false);if(e.target.id==='xyStartDue')startXYBatch(0,true);if(e.target.id==='xyLoadCourse')loadXYCourse(true);const unit=e.target.closest?.('[data-xy-unit]');if(unit){state.xyCourseUnit=Number(unit.dataset.xyUnit);save();render()}const course=e.target.closest?.('[data-xy-course]');if(course)startXYCourse(course.dataset.xyCourse);const edit=e.target.closest?.('[data-xy-edit]');if(edit)editXYWord(Number(edit.dataset.xyEdit));const del=e.target.closest?.('[data-xy-delete]');if(del)deleteXYWord(Number(del.dataset.xyDelete));if(e.target.id==='xyHint'){state.xyHint=true;save();render()}if(e.target.id==='xyReveal'){const name=(state.xyQueue||[])[0],cache=(state.dictionaryCache||{})[name];state.xyRevealed=true;save();speak(name);render();if(name&&(!cache||!cache.exampleCn))setTimeout(()=>enrichWord(name,false),80)}const rate=e.target.closest?.('[data-xy-rate]');if(rate)rateXY(Number(rate.dataset.xyRate));if(e.target.id==='xyExit')pauseXYAndBrowse()});

render();
loadFullCETWords(false);
if(!(state.xyCourseUnits||[]).length)setTimeout(()=>loadXYCourse(false),900);
if(state.lastOnlineCheck!==today())setTimeout(()=>checkOnlineCourse(false),700);
</script>
