function ensureBedtime(){dailyWordList();if(state.bedtimeDate!==today()){state.bedtimeDate=today();state.bedtimePending=[...new Set([...state.dailyWords,...allWords().filter(w=>(state.wrong[w.word]||0)>0).sort((a,b)=>state.wrong[b.word]-state.wrong[a.word]).slice(0,4).map(w=>w.word)])];state.bedtimeDoneDate='';save()}}
let bedtimeRevealed=false;
function bedtime(){ensureBedtime();if(!state.bedtimePending.length)return `<div class="shell">${head('睡前10分钟','今天的内容已经复习完成')}<div class="panel"><div class="empty">🌙 今天辛苦了，全部过关<br><br>现在安心睡觉，明天课前再温故一次。</div></div></div>`;const w=wordByName(state.bedtimePending[0]),g=wordGuide(w);return `<div class="shell">${head('睡前10分钟',`剩 ${state.bedtimePending.length} 个 · 快速回忆即可`)}<section class="study-card"><span class="tag">🌙 今日词＋易错词</span><div class="word">${escapeHtml(w.word)}</div><div class="ipa">${w.ipa}</div><button class="speak" data-speak="${escapeHtml(w.word)}">🔊</button><div class="${bedtimeRevealed?'':'hidden'}"><div class="meaning">${w.meaning}</div><div class="phrase">${w.phrase}</div><div class="teacher-note"><b>快速提醒</b><div>${escapeHtml(g.memory)}</div></div></div></section>${bedtimeRevealed?`<div class="study-actions"><button class="btn wrong" data-bedtime="0">还没记牢</button><button class="btn right" data-bedtime="1">记住了</button></div>`:`<button class="btn" id="revealBedtime" style="width:100%;margin-top:15px">显示答案</button>`}</div>`}
function nextBedtime(ok){const name=state.bedtimePending[0];if(!name)return;state.todayCount++;state.bedtimePending.shift();if(ok)state.wrong[name]=Math.max(0,(state.wrong[name]||0)-1);else{state.wrong[name]=(state.wrong[name]||0)+1;state.bedtimePending.push(name)}if(!state.bedtimePending.length)state.bedtimeDoneDate=today();bedtimeRevealed=false;save();render()}
let currentQuiz=null,answered=false;
function grammarLesson(){const topics=dailyGrammarTopics();return `<div class="shell">${head('今日语法讲解','只讲与今日单词有关的内容')}<div class="tabs"><button class="tab" data-mode="challenge">词义刷题</button><button class="tab active">先学语法</button></div>${topics.map((t,i)=>`<section class="panel" style="padding:18px;margin-bottom:12px"><span class="tag">知识点 ${i+1}</span><h3 style="margin:14px 0 8px">${escapeHtml(t.title)}</h3><p style="font-size:14px;line-height:1.7;margin:0">${escapeHtml(t.rule)}</p><div class="teacher-note"><b>结合今日单词</b>${t.examples.map(x=>`<div>${escapeHtml(x)}</div>`).join('')}<div><strong>稍后练习：</strong>${t.questions.map(q=>q.words.filter(w=>dailyWordList().some(x=>x.word===w)).join(' / ')).filter(Boolean).join('、')}</div></div></section>`).join('')}<button class="btn" id="startGrammar" style="width:100%;margin-top:4px">我学完了，开始做相关题</button></div>`}
function startGrammarPractice(){const qs=dailyGrammarQuestions();state.grammarReady=true;state.grammarPending=shuffle(qs.map(q=>q.gid));state.grammarMistakes=[];state.grammarCompletedDate='';currentQuiz=null;answered=false;save();render()}
function finishGrammarRound(){if(state.grammarMistakes.length){state.grammarPending=shuffle([...new Set(state.grammarMistakes)]);state.grammarMistakes=[];save();return'重测'}state.grammarCompletedDate=today();state.grammarPending=[];if(state.vocabPhase==='complete')state.completedCourses=[...new Set([...(state.completedCourses||[]),Number(state.selectedCourse)])];save();return'完成'}
function startQuizRound(words){state.vocabPhase='quiz';state.quizPending=shuffle([...new Set(words)]);state.quizMistakes=[];state.mode='challenge';currentQuiz=null;answered=false;save()}
function makeQuiz(){if(state.mode==='grammar'){const all=dailyGrammarQuestions(),g=all.find(x=>x.gid===state.grammarPending[0]);return g?{...g,type:'grammar',options:shuffle(g.options)}:null}ensureFlow();if(state.vocabPhase==='quiz'&&!state.quizPending.length)finishQuizRound();const w=wordByName(state.quizPending[0]);if(!w)return null;const pool=dailyWordList(),opts=shuffle([w,...shuffle(pool.filter(x=>x.word!==w.word)).slice(0,3)]).map(x=>x.meaning);return{type:'choice',q:w.word,answer:w.meaning,word:w,options:opts,note:wordGuide(w).explain}}
function finishQuizRound(){if(state.quizMistakes.length){state.vocabPhase='relearn';state.dailyPending=[...new Set(state.quizMistakes)];state.dailyRemembered=[];state.quizPending=[];state.quizMistakes=[];state.quizRound++;state.tab='learn';save();return'回炉'}state.vocabPhase='complete';state.learned=[...new Set([...state.learned,...state.dailyWords])];state.dailyWords.forEach(w=>state.wrong[w]=0);if(state.grammarCompletedDate===today())state.completedCourses=[...new Set([...(state.completedCourses||[]),Number(state.selectedCourse)])];state.quizPending=[];save();return'完成'}
function quiz(){ensureFlow();if(state.mode==='grammar'){const qs=dailyGrammarQuestions();if(!qs.length)return `<div class="shell">${head('今日语法','今天暂时没有匹配的语法内容')}<div class="panel"><div class="empty">今天只复习词汇，新的语法会随下一课一起更新。</div></div></div>`;if(!state.grammarReady)return grammarLesson();if(!state.grammarPending.length&&state.grammarCompletedDate!==today())finishGrammarRound();if(state.grammarCompletedDate===today())return `<div class="shell">${head('今日语法已完成','讲解对应题已全部做对')}<div class="tabs"><button class="tab" data-mode="challenge">词义刷题</button><button class="tab active">语法 ✓</button></div><div class="panel"><div class="empty">🎉 今天的语法也通过了<br><br><button class="btn secondary" id="restartGrammar">重新学习和练习</button></div></div></div>`}else if(state.vocabPhase!=='quiz'&&state.vocabPhase!=='complete'){const msg=state.warmupPending.length?'先完成课前温故':state.vocabPhase==='relearn'?'先把错词重新背熟':'先把今日单词全部记住';return `<div class="shell">${head('今日闯关','完成背词后才能开始')}<div class="tabs"><button class="tab active" data-mode="challenge">词义刷题</button><button class="tab" data-mode="grammar">语法讲解</button></div><div class="panel"><div class="empty">🔒 ${msg}<br><br><button class="btn" data-go="learn">去背词</button></div></div></div>`}else if(state.vocabPhase==='complete')return `<div class="shell">${head('今日闯关完成','所有词都已做对')}<div class="tabs"><button class="tab active">词义刷题 ✓</button><button class="tab" data-mode="grammar">语法讲解</button></div><div class="panel"><div class="empty">🎉 词汇闯关成功<br><br>今天的错词已经背诵并重新答对。<br><br><button class="btn" data-mode="grammar">继续语法学习</button></div></div></div>`;if(!currentQuiz)currentQuiz=makeQuiz();const q=currentQuiz;if(!q)return `<div class="shell">${head('正在整理本轮结果','请稍候…')}</div>`;const body=`<div class="options">${q.options.map(o=>`<button class="option" data-opt="${escapeHtml(o)}">${escapeHtml(o)}</button>`).join('')}</div>`;const sub=state.mode==='grammar'?`只考刚讲过的内容 · 剩 ${state.grammarPending.length} 题`:`只做词义选择 · 第 ${state.quizRound} 轮剩 ${state.quizPending.length} 题`;return `<div class="shell">${head(state.mode==='grammar'?'相关语法练习':'今日词义刷题',sub)}<div class="tabs"><button class="tab ${state.mode!=='grammar'?'active':''}" data-mode="challenge">词义刷题</button><button class="tab ${state.mode==='grammar'?'active':''}" data-mode="grammar">语法讲解</button></div><section class="panel" style="padding:22px"><span class="tag">${q.type==='grammar'?'刚讲过的考点':'英文选中文'}</span><div class="quiz-q">${escapeHtml(q.q)}</div>${body}<div id="feedback"></div></section></div>`}
function wrong(){const list=allWords().filter(w=>(state.wrong[w.word]||0)>0).sort((a,b)=>state.wrong[b.word]-state.wrong[a.word]);return `<div class="shell">${head('错题本',`${list.length} 个词需要回炉`)}<div class="panel">${list.length?list.map(w=>`<div class="word-row"><div><b>${escapeHtml(w.word)}</b><span>${w.meaning} · 错误权重 ${state.wrong[w.word]}</span></div><button class="mini" data-speak="${escapeHtml(w.word)}">🔊</button></div>`).join(''):`<div class="empty">暂时没有错题，继续保持！</div>`}</div>${list.length?'<button class="btn" id="reviewWrong" style="width:100%;margin-top:14px">只练错题</button>':''}</div>`}
function me(){return `<div class="shell">${head('我的学习','进度保存在这台手机')}<div class="panel"><div class="setting"><b>📚 已掌握 ${state.learned.length} / ${allWords().length} 词</b><div class="date">今天完成 ${state.todayCount} 次单词练习、${state.quizCount} 道题</div></div><div class="setting"><b>添加自己的单词</b><form class="form" id="addForm" style="margin-top:12px"><input class="field" name="word" placeholder="英文，如 liberty" required autocapitalize="none"><input class="field" name="meaning" placeholder="中文意思" required><button class="btn">加入题库</button></form></div><div class="setting"><b>换手机备份</b><div class="date">仅换手机时使用；“下载备份”会保存 JSON 文件</div><div class="study-actions"><button class="btn secondary" id="export">下载备份</button><label class="btn secondary" style="text-align:center">恢复备份<input id="import" type="file" accept="application/json" hidden></label></div></div><div class="setting"><button class="btn wrong" id="reset" style="width:100%">清空本机进度</button></div></div><div class="panel" style="margin-top:14px"><b>安装到 iPhone 主屏幕</b><p class="date" style="line-height:1.7">用 Safari 打开本页 → 点“分享” → “添加到主屏幕” → 打开“作为网页 App”。之后像普通 App 一样使用。</p></div></div>`}
function render(){const views={home,learn,quiz,wrong,me,courses,bedtime};$('#app').innerHTML=(views[state.tab]||home)();if(state.tab==='home'){const grid=$('.grid');if(grid)grid.insertAdjacentHTML('afterend',`<div class="grid" style="margin-top:12px"><button class="action" data-go="courses"><span class="icon">📚</span><b>课程中心</b><small>${escapeHtml(state.courseTitle||'选择课程')} · 共 ${COURSE_CATALOG.length} 课</small></button><button class="action" data-go="bedtime"><span class="icon">🌙</span><b>睡前10分钟</b><small>${state.bedtimeDoneDate===today()?'今日已完成':'当天词＋易错词快速复习'}</small></button></div>`)}if(state.tab==='me'){const first=$('.panel .setting');if(first)first.insertAdjacentHTML('afterend','<div class="setting"><b>发送学习进度给英语老师</b><div class="date">生成今日学习记录并发送到 ChatGPT；不会下载文件</div><button class="btn" id="syncTeacher" style="width:100%;margin-top:12px">发送到 ChatGPT</button></div><div class="setting"><b>联网更新课程</b><div class="date">当前：'+escapeHtml(state.courseTitle||'基础课程')+' · 已同步至第 '+(state.onlineLesson||0)+' 课</div><button class="btn" id="onlineUpdate" style="width:100%;margin-top:12px">检查并更新</button><label class="btn secondary" style="display:block;text-align:center;margin-top:10px">手动导入课程包<input id="courseImport" type="file" accept="application/json,.json" hidden></label></div>')}renderNav();bind();bindCourseImport()}
function syncReport(){const weak=allWords().filter(w=>(state.wrong[w.word]||0)>0).sort((a,b)=>state.wrong[b.word]-state.wrong[a.word]).slice(0,12).map(w=>w.word).join('、')||'暂无';return `【承希英语学习记录】\n日期：${today()}\n当前课程：${state.courseTitle||'未选择'}\n今日单词练习：${state.todayCount} 次\n今日刷题：${state.quizCount} 道\n睡前复习：${state.bedtimeDoneDate===today()?'已完成':'未完成'}\n累计掌握：${state.learned.length}/${allWords().length} 词\n已完成课程：${(state.completedCourses||[]).length}/${COURSE_CATALOG.length}\n当前易错词：${weak}\n请根据这份记录更新我的学习档案，并安排下一次英语学习。`}
function validateCoursePack(pack){if(!pack||!Array.isArray(pack.words)||!Array.isArray(pack.grammar))throw new Error('invalid');for(const w of pack.words){if(!w.word||!w.meaning)throw new Error('invalid word')}for(const g of pack.grammar){if(!g.q||!g.answer||!Array.isArray(g.options))throw new Error('invalid grammar')}return pack}
function applyCoursePack(pack){validateCoursePack(pack);const lesson=Number(pack.lesson)||0,isNew=lesson>(state.onlineLesson||0);const words=[...(state.lessonWords||[]),...pack.words];const grammar=[...(state.lessonGrammar||[]),...pack.grammar];state.lessonWords=words.filter((w,i,a)=>a.findIndex(x=>x.word===w.word)===i);state.lessonGrammar=grammar.filter((g,i,a)=>a.findIndex(x=>x.q===g.q)===i);state.courseTitle=pack.title||'新课程';state.onlineLesson=Math.max(state.onlineLesson||0,lesson);state.lastOnlineCheck=today();if(isNew){if(state.dailyWords.length){state.previousLessonWords=[...state.dailyWords];state.lessonArchive=[...new Set([...(state.lessonArchive||[]),...state.dailyWords])]}state.dailyWordDate='';state.dailyWords=[];state.dailyPending=[];state.dailyRemembered=[];state.warmupWords=[];state.warmupPending=[];state.vocabPhase='learn';state.quizPending=[];state.quizMistakes=[];state.quizRound=1;state.grammarStudyDate='';state.grammarReady=false;state.grammarPending=[];state.grammarMistakes=[];state.grammarCompletedDate=''}save()}
async function checkOnlineCourse(manual=true){const btn=$('#onlineUpdate');if(btn){btn.disabled=true;btn.textContent='正在检查…'}try{const res=await fetch(REMOTE_COURSE_URL+'?t='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('network');const pack=validateCoursePack(await res.json());const lesson=Number(pack.lesson)||0;if(lesson<=(state.onlineLesson||0)){state.lastOnlineCheck=today();save();if(manual)toast('已经是最新课程');if(btn){btn.disabled=false;btn.textContent='检查并更新'}return}applyCoursePack(pack);render();toast(`联网更新成功：${pack.words.length} 个词，${pack.grammar.length} 道语法题`)}catch(e){if(manual)toast('暂时无法联网，请稍后再试');if(btn){btn.disabled=false;btn.textContent='检查并更新'}}}
function bindCourseImport(){const input=$('#courseImport');if(!input)return;input.onchange=async()=>{try{const pack=JSON.parse(await input.files[0].text());applyCoursePack(pack);render();toast(`已更新：${pack.words.length} 个词，${pack.grammar.length} 道语法题`)}catch(e){toast('课程包格式不正确，请重新下载')}}}
function nextStudy(ok){const names=currentStudyList(),name=names[0];if(!name)return;if(state.warmupPending.length){state.warmupPending.shift();state.todayCount++;if(!ok){state.warmupForgotten=[...new Set([...state.warmupForgotten,name])];state.wrong[name]=(state.wrong[name]||0)+2;if(!state.dailyWords.includes(name))state.dailyWords.push(name);if(!state.dailyPending.includes(name))state.dailyPending.push(name)}else state.wrong[name]=Math.max(0,(state.wrong[name]||0)-1)}else{record(name,ok);if(ok){state.dailyPending.shift();state.dailyRemembered=[...new Set([...state.dailyRemembered,name])]}else{state.dailyPending.shift();state.dailyPending.push(name)}if(!state.dailyPending.length){const roundWords=[...state.dailyRemembered];state.dailyRemembered=[];startQuizRound(roundWords)}}revealed=false;save();render()}
function answerQuiz(ans,button){if(answered)return;answered=true;const q=currentQuiz,ok=ans.trim().toLowerCase()===q.answer.toLowerCase();state.quizCount++;if(q.word){record(q.word.word,ok);state.quizPending=state.quizPending.filter(w=>w!==q.word.word);if(!ok)state.quizMistakes=[...new Set([...state.quizMistakes,q.word.word])]}else if(q.type==='grammar'){state.grammarPending=state.grammarPending.filter(id=>id!==q.gid);if(!ok)state.grammarMistakes=[...new Set([...state.grammarMistakes,q.gid])];save()}else save();if(button){document.querySelectorAll('.option').forEach(b=>{if(b.dataset.opt===q.answer)b.classList.add('correct')});if(!ok)button.classList.add('wrong')}const f=$('#feedback');const lesson=q.note?`<br><strong>👩‍🏫 老师讲解：</strong>${escapeHtml(q.note)}`:'';const roundEnd=q.word&&!state.quizPending.length||q.type==='grammar'&&!state.grammarPending.length;f.innerHTML=`<div class="feedback ${ok?'good':'bad'}">${ok?'✅ 正确':'❌ 正确答案：'+escapeHtml(q.answer)}${lesson}</div><button class="btn" id="nextQ" style="width:100%;margin-top:10px">${roundEnd?'查看本轮结果':'下一题'}</button>`;$('#nextQ').onclick=()=>{if(q.word&&!state.quizPending.length)finishQuizRound();if(q.type==='grammar'&&!state.grammarPending.length)finishGrammarRound();currentQuiz=null;answered=false;render()}}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.go;if(state.tab==='quiz')state.mode='challenge';save();render()});document.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>speak(b.dataset.speak));const slow=$('#slowBtn');if(slow)slow.onclick=()=>{const w=wordByName(currentStudyList()[0]);if(w)speak(w.word,true)};const rev=$('#reveal');if(rev)rev.onclick=()=>{revealed=true;render()};document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>nextStudy(b.dataset.rate==='1'));document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;currentQuiz=null;answered=false;save();render()});document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>answerQuiz(b.dataset.opt,b));const ss=$('#submitSpell');if(ss)ss.onclick=()=>answerQuiz($('#spell').value);const sp=$('#spell');if(sp)sp.onkeydown=e=>{if(e.key==='Enter')answerQuiz(sp.value)};const rw=$('#reviewWrong');if(rw)rw.onclick=()=>{const words=allWords().filter(w=>(state.wrong[w.word]||0)>0).map(w=>w.word);state.dailyWords=[...new Set([...state.dailyWords,...words])];state.dailyPending=[...words];state.dailyRemembered=[];state.vocabPhase='relearn';state.tab='learn';save();render()};const sync=$('#syncTeacher');if(sync)sync.onclick=async()=>{const report=syncReport();try{if(navigator.share)await navigator.share({title:'承希英语学习记录',text:report});else throw new Error('share unavailable')}catch(e){if(e.name!=='AbortError'){const ta=document.createElement('textarea');ta.value=report;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('记录已复制，请粘贴到 ChatGPT')}}};const online=$('#onlineUpdate');if(online)online.onclick=()=>checkOnlineCourse(true);const form=$('#addForm');if(form)form.onsubmit=e=>{e.preventDefault();const fd=new FormData(form);const word=fd.get('word').trim().toLowerCase(),meaning=fd.get('meaning').trim();if(allWords().some(x=>x.word===word))return toast('这个词已经在题库里了');state.custom.push({word,meaning,ipa:'',phrase:'你自己添加的单词'});save();form.reset();toast('已加入题库')};const ex=$('#export');if(ex)ex.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'}));a.download='承希英语学习记录.json';a.click();URL.revokeObjectURL(a.href)};const im=$('#import');if(im)im.onchange=async()=>{try{state={...defaultState,...JSON.parse(await im.files[0].text())};save();render();toast('学习记录已恢复')}catch{toast('文件格式不正确')}};const reset=$('#reset');if(reset)reset.onclick=()=>{if(confirm('确定清空全部学习进度吗？')){state={...defaultState};save();render()}}}

document.addEventListener('click',e=>{const course=e.target.closest?.('[data-course]');if(course)selectCourse(course.dataset.course);if(e.target.id==='startGrammar')startGrammarPractice();if(e.target.id==='restartGrammar'){state.grammarReady=false;state.grammarPending=[];state.grammarMistakes=[];state.grammarCompletedDate='';currentQuiz=null;answered=false;save();render()}if(e.target.id==='revealBedtime'){bedtimeRevealed=true;render()}const bedtimeBtn=e.target.closest?.('[data-bedtime]');if(bedtimeBtn)nextBedtime(bedtimeBtn.dataset.bedtime==='1')});

render();
if(state.lastOnlineCheck!==today())setTimeout(()=>checkOnlineCourse(false),700);
</script>
